// Moving the slider redraws only the chart and lists, so dragging stays smooth.
let skyFrame = 0;
function updateSky(parts = ['dome', 'clock', 'pick', 'up']) {
  cancelAnimationFrame(skyFrame);
  skyFrame = requestAnimationFrame(() => {
    const el = id => document.getElementById(id);
    if (parts.includes('dome') && el('sky-dome')) el('sky-dome').innerHTML = skySvg();
    if (parts.includes('clock') && el('sky-clock')) el('sky-clock').textContent = clock(skyState.t);
    if (parts.includes('pick') && el('sky-pick')) el('sky-pick').innerHTML = skyState.full && !skyState.pick ? '' : pickHtml();
    if (parts.includes('up') && el('sky-up')) el('sky-up').innerHTML = upTonightHtml();
  });
}

/* Full screen: pinch to zoom, drag to pan, double-tap to reset; a mouse wheel zooms on a desktop.
   While a gesture runs only the view window moves; the chart redraws when it ends, so
   star sizes and labels suit the new zoom. */
const skyGesture = { pts: new Map(), start: null, moved: false, suppress: false, lastTap: 0, redraw: 0 };

function setZoom(z) {
  const s = Math.min(MAX_ZOOM, Math.max(1, z.s));
  const lim = K * (1 - 1 / s) + 0.16 * K / s; // keep the dome in view
  skyState.zoom = { s, x: Math.max(-lim, Math.min(lim, z.x)), y: Math.max(-lim, Math.min(lim, z.y)) };
  const svg = document.querySelector('#sky-dome svg');
  if (svg) {
    svg.setAttribute('viewBox', viewBoxOf(skyState.zoom).map(v => v.toFixed(1)).join(' '));
    svg.style.setProperty('--z', s);
  }
  clearTimeout(skyGesture.redraw);
  skyGesture.redraw = setTimeout(() => updateSky(['dome']), 180);
}

function attachSkyGestures() {
  const dome = document.getElementById('sky-dome');
  if (!dome || !skyState.full) return;
  const units = () => (2 * HALF) / skyState.zoom.s / dome.getBoundingClientRect().width; // chart units per screen pixel
  const centre = () => { const r = dome.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const snapshot = () => {
    const pts = [...skyGesture.pts.values()];
    const mid = pts.length === 2 ? [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2] : [pts[0].x, pts[0].y];
    const dist = pts.length === 2 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
    return { zoom: { ...skyState.zoom }, mid, dist, u: units() };
  };
  dome.addEventListener('pointerdown', e => {
    skyGesture.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    skyGesture.start = snapshot();
    if (skyGesture.pts.size === 1) { skyGesture.moved = false; skyGesture.suppress = false; skyGesture.downAt = Date.now(); }
  });
  dome.addEventListener('pointermove', e => {
    if (!skyGesture.pts.has(e.pointerId)) return;
    skyGesture.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const st = skyGesture.start;
    const now = snapshot();
    if (Math.hypot(now.mid[0] - st.mid[0], now.mid[1] - st.mid[1]) > 6 || (st.dist && Math.abs(now.dist - st.dist) > 6)) skyGesture.moved = true;
    if (!skyGesture.moved) return;
    const [cx, cy] = centre();
    const s = st.dist && now.dist ? st.zoom.s * (now.dist / st.dist) : st.zoom.s;
    // The chart point under the starting midpoint stays under the fingers.
    const wx = st.zoom.x + (st.mid[0] - cx) * st.u, wy = st.zoom.y + (st.mid[1] - cy) * st.u;
    const u = (st.u * st.zoom.s) / s;
    setZoom({ s, x: wx - (now.mid[0] - cx) * u, y: wy - (now.mid[1] - cy) * u });
  });
  const end = e => {
    if (!skyGesture.pts.delete(e.pointerId)) return;
    if (skyGesture.pts.size) { skyGesture.start = snapshot(); return; }
    if (skyGesture.moved) { skyGesture.suppress = true; return; }
    // A quick second tap in the same place resets the zoom.
    const now = Date.now();
    if (now - skyGesture.lastTap < 320 && skyState.zoom.s > 1) { skyGesture.suppress = true; setZoom({ s: 1, x: 0, y: 0 }); }
    skyGesture.lastTap = now;
  };
  dome.addEventListener('pointerup', end);
  dome.addEventListener('pointercancel', end);
  dome.addEventListener('wheel', e => {
    e.preventDefault();
    const [cx, cy] = centre();
    const u = units();
    const wx = skyState.zoom.x + (e.clientX - cx) * u, wy = skyState.zoom.y + (e.clientY - cy) * u;
    const s = skyState.zoom.s * Math.exp(-e.deltaY * 0.0015);
    const u2 = (u * skyState.zoom.s) / Math.min(MAX_ZOOM, Math.max(1, s));
    setZoom({ s, x: wx - (e.clientX - cx) * u2, y: wy - (e.clientY - cy) * u2 });
  }, { passive: false });
}

/* ---------- Which came first? ---------- */
// Two dated events from the decks; tap the earlier. Ten pairs a run, from gaps
// of centuries down to close calls. It never touches the schedule.
const DUEL_LENGTH = 10;
// Gap range in years for each pair of a run, widest first.
const DUEL_GAPS = [[300, 5000], [300, 5000], [150, 300], [80, 150], [40, 80], [40, 80], [20, 40], [10, 20], [3, 10], [3, 10]];
let duelEvents = null;
let duel = null; // { pairs: [[a, b]], i, chosen, results }

// Every card with a definite year: discoveries, battles, works and records,
// space firsts. Approximate dates ("c. 1021", "1630s", "date unknown") are left out.
function datedEvents() {
  if (duelEvents) return duelEvents;
  const out = [];
  const yearAtEnd = s => {
    const m = /(?:^|·\s*)(\d{1,4})(\s*BC)?$/.exec(s || '');
    return m ? (m[2] ? -m[1] : +m[1]) : null;
  };
  for (const d of decks) {
    for (const c of d.cards) {
      let year = null, title, text;
      if (d.id === 'discoveries') {
        year = yearAtEnd(c.context); title = c.answer; text = c.prompt;
      } else if (d.id === 'medieval' && /^\d{3,4}$/.test(c.answer)) {
        year = +c.answer; title = c.prompt; text = c.context;
      } else if (d.id === 'music') {
        year = yearAtEnd(c.context); title = c.prompt; text = `${c.answer}, ${(c.context || '').split(' · ')[0].toLowerCase()}`;
      } else if (d.id === 'sky-and-space' && c.group === 'Space firsts') {
        year = yearAtEnd(c.context); title = c.answer;
        text = `${c.label || 'First'} ${c.prompt[0].toLowerCase()}${c.prompt.slice(1)}`;
      }
      if (year !== null && !/c\.\s*\d|uncertain|unknown|\d0s\b/.test(c.context || '')) {
        out.push({ id: c.id, deck: d.title, year, title, text });
      }
    }
  }
  return (duelEvents = out);
}

function startDuel() {
  const events = datedEvents();
  const used = new Set();
  const pairs = [];
  for (const [lo, hi] of DUEL_GAPS) {
    // A random event, then a partner at the right distance, preferably from another deck.
    for (let tries = 0; tries < 200; tries++) {
      const a = events[Math.floor(Math.random() * events.length)];
      if (used.has(a.id)) continue;
      const fits = events.filter(b => !used.has(b.id) && b.id !== a.id && Math.abs(a.year - b.year) >= lo && Math.abs(a.year - b.year) <= hi);
      if (!fits.length) continue;
      const other = fits.filter(b => b.deck !== a.deck);
      const pool = other.length && tries < 150 ? other : fits;
      const b = pool[Math.floor(Math.random() * pool.length)];
      used.add(a.id); used.add(b.id);
      pairs.push(Math.random() < 0.5 ? [a, b] : [b, a]);
      break;
    }
  }
  duel = { pairs, i: 0, chosen: null, results: [] };
  go('duel');
}

const yearText = y => (y < 0 ? `${-y} BC` : `${y}`);

function duelVerdict([a, b]) {
  const [first, second] = a.year < b.year ? [a, b] : [b, a];
  const gap = second.year - first.year;
  return `${first.title}, ${yearText(first.year)}, came ${gap} year${gap === 1 ? '' : 's'} before ${second.title}, ${yearText(second.year)}.`;
}

function renderDuel() {
  const pair = duel.pairs[duel.i];
  const done = duel.chosen !== null;
  const firstIndex = pair[0].year < pair[1].year ? 0 : 1;
  const choice = (e, k) => {
    const state = !done ? '' : k === firstIndex ? ' right' : k === duel.chosen ? ' wrong' : '';
    const action = done ? `data-action="peek" data-id="${esc(e.id)}"` : `data-action="duel-pick" data-k="${k}"`;
    return `<button class="duel-choice${state}" ${action}>
      ${done ? `<span class="duel-year">${esc(yearText(e.year))}</span>` : ''}
      <span class="duel-title">${esc(e.title)}</span>
      <span class="duel-text">${esc(e.text)}</span>
      <small>${esc(e.deck)}${done ? ' · read the card' : ''}</small>
    </button>`;
  };
  return `<div class="round">
    <div class="topbar">
      <button class="close" data-action="home" aria-label="End">×</button>
      <div class="track"><i style="width:${pct(duel.i, duel.pairs.length)}%"></i></div>
      <span class="count">${duel.i + 1} / ${duel.pairs.length}</span>
    </div>
    <div class="duel">
      <p class="label">Which came first?</p>
      ${choice(pair[0], 0)}
      ${choice(pair[1], 1)}
      ${done ? `<p class="duel-verdict">${duel.chosen === firstIndex ? 'Right. ' : 'Not quite. '}${esc(duelVerdict(pair))}</p>` : ''}
    </div>
    <div class="actions">${done ? '<button class="btn" data-action="duel-next">Next</button>' : ''}</div>
  </div>`;
}

function onDuelPick(k) {
  if (duel.chosen !== null) return;
  const pair = duel.pairs[duel.i];
  duel.chosen = k;
  duel.results.push(pair[k].year <= pair[1 - k].year ? 'knew' : 'missed');
  render();
}

function onDuelNext() {
  duel.i++;
  duel.chosen = null;
  if (duel.i < duel.pairs.length) render();
  else go('duel-end');
}

function renderDuelEnd() {
  const right = duel.results.filter(r => r === 'knew').length;
  const rows = duel.pairs.map(([a, b], k) => {
    const [first, second] = a.year < b.year ? [a, b] : [b, a];
    return `<div class="entry">
      <div class="p">${esc(first.title)} <span class="muted">${esc(yearText(first.year))}</span></div>
      <span class="result ${duel.results[k]}">${DOT[duel.results[k]]}</span>
      <div class="a">then ${esc(second.title)} <span class="muted">${esc(yearText(second.year))}</span></div>
    </div>`;
  }).join('');
  return `<h2 class="pagetitle">Which came first?</h2>
    <p class="lede">${right} of ${duel.pairs.length} in the right order.</p>
    <p class="dots big">${dots(duel.results)}</p>
    ${rows}
    <div class="stack">
      <button class="btn" data-action="duel">Play again</button>
      <button class="btn quiet" data-action="home">Back to the almanac</button>
    </div>`;
}

/* ---------- Your month ---------- */
// What you settled and met in a month, deck by deck, with your daily fives and
// journeys. Only what was achieved: no comparisons, no count of days missed.

// When a card was first met and first settled. Records from before these dates
// were kept (October 2026) fall back to the last review: every card settled by
// then was still in its first settled box, so its last review is its settling day.
function cardDates(st) {
  return { first: st.f ?? st.l, settled: st.s ?? (st.b >= SETTLED_BOX ? st.l : null) };
}
const monthOf = day => new Date(day * 86400000).toISOString().slice(0, 7); // day numbers are local days
const monthName = key => new Date(key + '-15T12:00').toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
let journeyTitles = null;

async function openMonth() {
  if (!journeyTitles) {
    try { journeyTitles = Object.fromEntries((await (await fetch('maps/journeys.json')).json()).map(r => [r.id, r.title])); }
    catch { journeyTitles = {}; }
  }
  go('month', { key: monthOf(today()) });
}

function monthsWithActivity() {
  const keys = new Set([monthOf(today())]);
  for (const st of Object.values(store.cards)) keys.add(monthOf(cardDates(st).first));
  for (const k of Object.keys(store.daily)) keys.add(k.slice(0, 7));
  return [...keys].sort();
}

// What a card taught you, for its button: the capital, the composer, the country on the map.
function learnedText(id) {
  const { card, answer } = sides(id);
  return card.map ? `${card.answer} on the map` : answer;
}

function renderMonth() {
  const key = view.key;
  const byDeck = new Map();
  const bucket = deckId => byDeck.get(deckId) || byDeck.set(deckId, { met: [], settled: [] }).get(deckId);
  for (const [id, st] of Object.entries(store.cards)) {
    const info = cardIndex.get(id);
    if (!info) continue; // a card from a deck since removed
    const { first, settled } = cardDates(st);
    if (monthOf(first) === key) bucket(info.deck.id).met.push(id);
    if (settled != null && monthOf(settled) === key) bucket(info.deck.id).settled.push(id);
  }
  let settledAll = 0, metAll = 0;
  for (const b of byDeck.values()) { settledAll += b.settled.length; metAll += b.met.length; }
  const dailyDays = Object.keys(store.daily).filter(k => k.startsWith(key)).sort();
  const journeys = Object.entries(store.journeys).filter(([, j]) => j.day.startsWith(key));

  const deckRows = decks.filter(d => byDeck.has(d.id)).map(d => {
    const { met, settled } = byDeck.get(d.id);
    const hard = [...settled].sort((a, b) => store.cards[b].n - store.cards[a].n).slice(0, 3);
    const parts = [];
    if (settled.length) parts.push(`${settled.length} settled`);
    if (met.length) parts.push(`${met.length} new`);
    return `<div class="month-deck">
      <div class="month-deck-head"><b>${esc(d.title)}</b><span>${parts.join(' · ')}</span></div>
      ${hard.length ? `<p class="label">Hard-won</p><div class="chips left">${hard.map(id =>
        `<button class="chip" data-action="peek" data-id="${esc(baseId(id))}">${esc(learnedText(id))}<small>${store.cards[id].n} reviews</small></button>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  const months = monthsWithActivity();
  const at = months.indexOf(key);
  const prev = months[at - 1], next = months[at + 1];
  const empty = !settledAll && !metAll && !dailyDays.length && !journeys.length;
  return `<button class="back" data-action="home">‹ Almanac</button>
    <div class="month-head">
      <button class="month-nav" data-action="month-go" data-key="${prev || ''}" ${prev ? '' : 'disabled'} aria-label="Previous month">‹</button>
      <h2 class="pagetitle">${esc(monthName(key))}</h2>
      <button class="month-nav" data-action="month-go" data-key="${next || ''}" ${next ? '' : 'disabled'} aria-label="Next month">›</button>
    </div>
    <p class="lede">Your month in the almanac.</p>
    ${empty ? '<p class="sky-hint">Nothing here yet. This page fills in as you go.</p>' : `
    <div class="tally">
      <div><b>${settledAll}</b><span>settled</span></div>
      <div><b>${metAll}</b><span>new cards met</span></div>
      <div><b>${dailyDays.length}</b><span>daily fives</span></div>
    </div>
    ${deckRows}
    ${dailyDays.length ? `<p class="label group">The daily five</p>${dailyDays.map(k =>
      `<button class="month-line" data-action="daily-day" data-key="${k}"><span>${esc(new Date(k + 'T12:00').toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric' }))}</span><span class="dots">${dots(store.daily[k])}</span></button>`).join('')}` : ''}
    ${journeys.length ? `<p class="label group">Journeys</p>${journeys.map(([id, j]) =>
      `<div class="month-line"><span>${esc((journeyTitles && journeyTitles[id]) || id)}</span><span class="dots">${dots(j.results)}</span></div>`).join('')}` : ''}`}`;
}

/* ---------- Views ---------- */
function go(name, params = {}) {
  view = { name, ...params };
  render();
  window.scrollTo(0, 0);
}

function render() {
  const views = { home: renderHome, round: renderRound, summary: renderSummary, browse: renderBrowse,
                  settings: renderSettings, peek: renderPeek, daily: renderDaily,
                  journeys: renderJourneys, journey: renderJourney, 'journey-end': renderJourneyEnd, sky: renderSky,
                  duel: renderDuel, 'duel-end': renderDuelEnd, month: renderMonth };
  $app.innerHTML = (views[view.name] || renderHome)();
  if (view.name === 'journey' || view.name === 'journey-end') decorateTrip(view.name === 'journey-end');
  const shown = view.name === 'round' ? round.queue[round.i].id : view.name === 'peek' ? view.id : null;
  if (shown) highlightMap(shown);
  if (view.name === 'sky') attachSkyGestures();
}

// Maps are shared SVGs; the card's country is lit by adding a class.
function highlightMap(id) {
  const { card } = cardIndex.get(id);
  const map = $app.querySelector('.map');
  if (!card.map || !map) return;
  map.querySelector(`[id="${card.target}"]`)?.classList.add('on');
  map.querySelectorAll(`[data-for="${card.target}"]`).forEach(r => r.classList.add('on'));
}

// The inside of a card: label, prompt (or map), context line, then the answer and note once revealed.
function faceHtml(id, revealed, extra = '') {
  const { card, label, prompt, answer, context } = sides(id);
  const note = store.settings.notes && card.note ? `<div class="note">${esc(card.note)}</div>` : '';
  return `<div class="label">${esc(label)}</div>
    ${card.map
      ? `<div class="map">${mapSvgs[card.map] || '<p class="map-missing">This map has not been downloaded yet; open Almanac once while online.</p>'}</div>
         <div class="context">${esc(prompt)}</div>`
      : `<div class="prompt ${lengthClass(prompt, 28, 60)}">${esc(prompt)}</div>
         <div class="context">${esc(context)}</div>`}
    ${extra}
    ${revealed ? `<div class="answer ${lengthClass(answer, 24, 45)}">${esc(answer)}</div>${note}${relatedHtml(id)}` : ''}`;
}

// Reading a linked card. `back` is the view to return to, so a round resumes exactly where it was.
function renderPeek() {
  const { card, deck } = cardIndex.get(view.id);
  const backTo = view.back.name === 'round' ? (round && round.daily ? 'Back to the daily five' : 'Back to the round') : 'Back';
  return `<button class="back" data-action="back">‹ ${backTo}</button>
    <div class="face peek${card.map ? ' has-map' : ''}">
      <p class="deckname">${esc(deck.title)}</p>
      ${faceHtml(view.id, true)}
    </div>`;
}

function renderDaily() {
  const res = store.daily[view.key] || [];
  const ids = dailyCards(view.key);
  const items = ids.map((id, i) => {
    const { card, prompt, answer } = sides(id);
    const [p, a] = card.map ? [answer, `${cardIndex.get(id).deck.title}`] : [prompt, answer];
    return `<button class="entry daily-entry" data-action="peek" data-id="${esc(id)}">
      <div class="p">${esc(p)}</div>
      <span class="result ${res[i] || ''}">${DOT[res[i]] || ''}</span>
      <div class="a">${esc(a)}</div>
    </button>`;
  }).join('');
  return `<button class="back" data-action="home">‹ Almanac</button>
    <h2 class="pagetitle">The daily five</h2>
    <p class="lede">${esc(longDate(view.key))}. The same five for everyone today; tap one to read it again.</p>
    <p class="dots big">${dots(res)}</p>
    ${items}
    <div class="stack">
      <button class="btn" data-action="share" data-key="${esc(view.key)}">Share</button>
      <button class="btn quiet" data-action="home">Back to the almanac</button>
    </div>`;
}

function renderHome() {
  const date = new Date().toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const p = plan();
  let todayHtml;
  if (!activeDecks().length) {
    todayHtml = `<h2>No decks in the mix</h2><p>Switch on a deck below to start a round.</p>`;
  } else if (p.due.length + p.fresh.length) {
    const parts = [];
    if (p.due.length) parts.push(`${p.due.length} to revisit`);
    if (p.fresh.length) parts.push(`${p.fresh.length} new`);
    todayHtml = `<h2>Today’s round</h2><p>${parts.join(' · ')}</p>
      <button class="btn" data-action="start">Begin</button>`;
  } else {
    todayHtml = `<h2>All caught up</h2><p>Nothing is due. ${nextDueText()}</p>`;
  }

  const rows = decks.map(d => {
    const st = deckStats(d);
    const on = !store.settings.off[d.id];
    return `<div class="deck">
      <button class="open" data-action="browse" data-deck="${esc(d.id)}">
        <div class="title">${esc(d.title)}</div>
        <div class="bar" aria-hidden="true">
          <span class="s" style="width:${pct(st.settled, st.total)}%"></span>
          <span class="l" style="width:${pct(st.learning, st.total)}%"></span>
        </div>
        <div class="meta">${st.settled} of ${st.total} settled${st.learning ? ` · ${st.learning} learning` : ''}</div>
        ${st.rseen ? `<div class="meta">Reverse: ${st.rsettled} of ${st.rtotal} settled</div>` : ''}
      </button>
      <button class="switch" role="switch" aria-checked="${on}" aria-label="Include ${esc(d.title)} in rounds"
        data-action="toggle" data-deck="${esc(d.id)}"></button>
    </div>`;
  }).join('');

  const done = store.daily[dayKey()];
  const dailyHtml = done
    ? `<div><h2>The daily five</h2><p class="dots">${dots(done)}</p></div>
       <div class="pair"><button class="btn quiet" data-action="daily-review">Review</button>
         <button class="btn quiet" data-action="share" data-key="${dayKey()}">Share</button></div>`
    : `<div><h2>The daily five</h2><p>Five questions, the same for everyone today.</p></div>
       <button class="btn" data-action="daily">Play</button>`;

  return `<header class="masthead"><h1>Almanac</h1><div class="date">${esc(date)}</div></header>
    <section class="daily">${dailyHtml}</section>
    <button class="linkrow" data-action="journeys"><span>Overland journeys</span><span aria-hidden="true">›</span></button>
    <button class="linkrow" data-action="sky"><span>Tonight’s sky</span><span aria-hidden="true">›</span></button>
    <button class="linkrow" data-action="duel"><span>Which came first?</span><span aria-hidden="true">›</span></button>
    <button class="linkrow" data-action="month"><span>Your month</span><span aria-hidden="true">›</span></button>
    <section class="today">${todayHtml}</section>
    <p class="label">Decks</p>
    ${rows}
    <div class="foot"><button class="link" data-action="settings">Settings</button></div>`;
}

function startRound() {
  const p = plan();
  const queue = shuffle([...p.due, ...p.fresh]).map(id => ({ id, tries: 0 }));
  if (!queue.length) return;
  round = { queue, i: 0, revealed: false, tally: { missed: 0, shaky: 0, knew: 0 }, missed: [] };
  go('round');
}

// What a card shows, in whichever direction this id asks for.
function sides(id) {
  const { card, deck } = cardIndex.get(id);
  const rev = id.endsWith(REV);
  return {
    card,
    label: rev ? (card.reverseLabel || deck.reverseLabel || '') : (card.label || deck.promptLabel || ''),
    prompt: rev ? card.answer : card.prompt,
    answer: rev ? card.prompt : card.answer,
    context: card.context || card.subregion || deck.context || deck.title,
  };
}

function lengthClass(text, long, longer) {
  return text.length > longer ? 'longer' : text.length > long ? 'long' : '';
}

function renderRound() {
  const entry = round.queue[round.i];
  const { card } = sides(entry.id);
  const actions = round.revealed
    ? `<button class="grade missed" data-action="grade" data-grade="missed">Missed</button>
       <button class="grade shaky" data-action="grade" data-grade="shaky">Shaky</button>
       <button class="grade knew" data-action="grade" data-grade="knew">Knew it</button>`
    : `<button class="btn" data-action="reveal">Show answer</button>`;

  return `<div class="round">
    <div class="topbar">
      <button class="close" data-action="home" aria-label="End round">×</button>
      <div class="track"><i style="width:${pct(round.i, round.queue.length)}%"></i></div>
      <span class="count">${round.daily ? 'Daily · ' : ''}${round.i + 1} / ${round.queue.length}</span>
    </div>
    <div class="face${card.map ? ' has-map' : ''}"${round.revealed ? '' : ' data-action="reveal"'}>
      ${faceHtml(entry.id, round.revealed, entry.tries ? '<div class="again">Second look</div>' : '')}
    </div>
    <div class="actions">${actions}</div>
  </div>`;
}

function onGrade(g) {
  if (round.daily) {
    round.results.push(g);
    round.i++;
    round.revealed = false;
    if (round.i >= round.queue.length) finishDaily();
    else render();
    return;
  }
  const entry = round.queue[round.i];
  // Only the first sighting in a round changes the schedule; repeats are practice.
  if (!entry.tries) {
    grade(entry.id, g);
    round.tally[g]++;
    if (g === 'missed') round.missed.push(entry.id);
  }
  if (g === 'missed' && entry.tries < 2) {
    const at = Math.min(round.i + 1 + REQUEUE_GAP, round.queue.length);
    round.queue.splice(at, 0, { id: entry.id, tries: entry.tries + 1 });
  }
  round.i++;
  round.revealed = false;
  if (round.i >= round.queue.length) go('summary');
  else render();
}

function entryHtml(id) {
  const { card, prompt, answer } = sides(id);
  // A map card's prompt is a picture, so list it by its answer instead.
  const [p, a, n] = card.map ? [answer, card.note, ''] : [prompt, answer, card.note];
  return `<div class="entry">
    <div class="p">${esc(p)}</div>
    <span class="dot ${status(id)}" aria-label="${status(id)}"></span>
    <div class="a">${esc(a)}</div>
    ${n ? `<div class="n">${esc(n)}</div>` : ''}
  </div>`;
}

function renderSummary() {
  const t = round.tally;
  const p = plan();
  const more = p.due.length + p.fresh.length;
  const missed = round.missed.map(entryHtml).join('');
  return `<h2 class="pagetitle">Round complete</h2>
    <div class="tally">
      <div><b>${t.knew}</b><span>knew it</span></div>
      <div><b>${t.shaky}</b><span>shaky</span></div>
      <div><b>${t.missed}</b><span>missed</span></div>
    </div>
    ${missed ? `<p class="label">Worth another look</p>${missed}` : ''}
    <div class="stack">
      ${more ? '<button class="btn" data-action="start">Another round</button>' : ''}
      <button class="btn quiet" data-action="home">Back to the almanac</button>
    </div>`;
}

function renderBrowse() {
  const deck = decks.find(d => d.id === view.deck);
  if (!deck) return renderHome();
  const st = deckStats(deck);
  let html = '';
  let group = null;
  for (const c of deck.cards) {
    const g = c.group || c.subregion;
    if (g && g !== group) {
      group = g;
      html += `<p class="label group">${esc(group)}</p>`;
    }
    html += entryHtml(c.id);
  }
  const example = deck.reversible && deck.cards.find(c => canReverse(deck, c));
  const reverse = example ? `<div class="setting row">
      <div><h3>Also ask in reverse</h3>
        <p>${esc(example.answer)} → ${esc(example.prompt)}. Each reversed card appears once you have known the forward one${st.rseen ? `; ${st.rsettled} of ${st.rtotal} settled so far` : ''}.</p></div>
      <button class="switch" role="switch" aria-checked="${reverseOn(deck)}" aria-label="Also ask in reverse"
        data-action="reverse" data-deck="${esc(deck.id)}"></button>
    </div>` : '';
  return `<button class="back" data-action="home">‹ Almanac</button>
    <h2 class="pagetitle">${esc(deck.title)}</h2>
    <p class="lede">${esc(deck.about || deck.subtitle || '')}</p>
    ${reverse}
    <div class="legend">
      <span><i class="dot settled"></i>${st.settled} settled</span>
      <span><i class="dot learning"></i>${st.learning} learning</span>
      <span><i class="dot"></i>${st.total - st.settled - st.learning} not yet seen</span>
    </div>
    ${html}
    <div class="stack"><button class="btn quiet" data-action="home">Back to the almanac</button></div>`;
}

function segmented(key, options) {
  return `<div class="seg">${options.map(v =>
    `<button data-action="set" data-key="${key}" data-value="${v}" aria-pressed="${store.settings[key] === v}">${v}</button>`
  ).join('')}</div>`;
}

function renderSettings() {
  return `<button class="back" data-action="home">‹ Almanac</button>
    <h2 class="pagetitle">Settings</h2>
    <p class="lede">Progress lives on this device only.</p>
    <div class="setting">
      <h3>Cards per round</h3>
      <p>The most a round will hold, however much is due.</p>
      ${segmented('size', [10, 15, 20, 30])}
    </div>
    <div class="setting">
      <h3>New cards per round</h3>
      <p>Only used when there is room left after the cards due.</p>
      ${segmented('fresh', [3, 5, 8, 12])}
    </div>
    <div class="setting row">
      <div><h3>Curiosity notes</h3><p>Show the short note under each answer.</p></div>
      <button class="switch" role="switch" aria-checked="${store.settings.notes}" aria-label="Curiosity notes" data-action="notes"></button>
    </div>
    <div class="setting row">
      <div><h3>Red light</h3><p>Dim red on black everywhere, to keep your night vision while stargazing. Turn your screen brightness down too.</p></div>
      <button class="switch" role="switch" aria-checked="${!!store.settings.night}" aria-label="Red light" data-action="night"></button>
    </div>
    <div class="setting">
      <h3>Back up progress</h3>
      <p>The home screen app keeps its own storage, separate from Safari. Export a copy now and then.</p>
      <div class="stack" style="margin-top:12px">
        <button class="btn quiet" data-action="export">Export progress</button>
        <button class="btn quiet" data-action="import">Import progress</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="setting">
      <h3>How it works</h3>
      <div class="about">
        <p>Each card returns just before you would forget it. Cards you know drift out to weeks, then months; shaky ones come back sooner.</p>
        <p>A card counts as settled once it is spaced 16 days or more apart. Missing a few days costs nothing: whatever is due simply waits, and each round stays small.</p>
      </div>
    </div>
    <div class="setting">
      <button class="btn quiet" data-action="reset" style="color:var(--accent)">Reset all progress</button>
    </div>`;
}

/* ---------- Backup ---------- */
async function exportProgress() {
  const name = `almanac-progress-${new Date().toLocaleDateString('en-CA')}.json`;
  const file = new File([JSON.stringify(store)], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Almanac progress' }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importProgress(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
    if (!data || typeof data.cards !== 'object') throw new Error('not Almanac progress');
  } catch {
    alert('That file could not be read as Almanac progress.');
    return;
  }
  if (!confirm('Replace the progress on this device with the imported file?')) return;
  store = normalise(data);
  saveStore();
  go('home');
}

/* ---------- Events ---------- */
$app.addEventListener('click', ev => {
  // A drag or pinch on the full-screen sky is not a tap.
  if (skyGesture.suppress && ev.target.closest('#sky-dome')) { skyGesture.suppress = false; return; }
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.deck;
  switch (el.dataset.action) {
    case 'start': startRound(); break;
    case 'daily': startDaily(); break;
    case 'journeys': trip = null; openJourneys(); break;
    case 'sky': openSky(); break;
    case 'duel': startDuel(); break;
    case 'month': openMonth(); break;
    case 'month-go': if (el.dataset.key) go('month', { key: el.dataset.key }); break;
    case 'daily-day': go('daily', { key: el.dataset.key }); break;
    case 'duel-pick': onDuelPick(+el.dataset.k); break;
    case 'duel-next': onDuelNext(); break;
    case 'sky-face': skyState.facing = +el.dataset.az; render(); break;
    case 'sky-pick':
      skyState.pick = { kind: el.dataset.kind, id: el.dataset.id };
      document.getElementById('sky-pick').innerHTML = pickHtml();
      if (!skyState.full) document.getElementById('sky-pick').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    case 'sky-unpick': skyState.pick = null; updateSky(['pick']); break;
    case 'sky-full': skyState.full = !skyState.full; render(); window.scrollTo(0, 0); break;
    case 'sky-layer': store.settings.skyLayers[el.dataset.layer] = !layerOn(el.dataset.layer); saveStore(); render(); break;
    case 'sky-night': case 'night':
      store.settings.night = !store.settings.night; saveStore(); applyNight(); render(); break;
    case 'journey': startJourney(world.routes.find(r => r.id === el.dataset.route)); break;
    case 'journey-surprise': startJourney(surpriseRoute()); break;
    case 'trip-reveal': trip.revealed = true; render(); break;
    case 'trip-grade': onTripGrade(el.dataset.grade); break;
    case 'daily-review': go('daily', { key: dayKey() }); break;
    case 'share': shareDaily(el.dataset.key); break;
    case 'peek': view = { name: 'peek', id: el.dataset.id, back: view }; render(); window.scrollTo(0, 0); break;
    case 'back': view = view.back; render(); window.scrollTo(0, 0); break;
    case 'reveal': round.revealed = true; render(); break;
    case 'grade': onGrade(el.dataset.grade); break;
    case 'home': round = null; go('home'); break;
    case 'browse': go('browse', { deck: id }); break;
    case 'settings': go('settings'); break;
    case 'toggle':
      if (store.settings.off[id]) delete store.settings.off[id];
      else store.settings.off[id] = true;
      saveStore(); render(); break;
    case 'reverse':
      if (store.settings.revOff[id]) delete store.settings.revOff[id];
      else store.settings.revOff[id] = true;
      saveStore(); render(); break;
    case 'set': store.settings[el.dataset.key] = Number(el.dataset.value); saveStore(); render(); break;
    case 'notes': store.settings.notes = !store.settings.notes; saveStore(); render(); break;
    case 'export': exportProgress(); break;
    case 'import': document.getElementById('import-file').click(); break;
    case 'reset':
      if (confirm('Forget everything you have learned in Almanac on this device? This cannot be undone.')) {
        store.cards = {}; saveStore(); go('home');
      }
      break;
  }
});

$app.addEventListener('input', ev => {
  if (ev.target.id !== 'sky-slider') return;
  skyState.t = new Date(skyState.sunset.getTime() + ev.target.value * STEP);
  updateSky();
});

$app.addEventListener('change', ev => {
  if (ev.target.id === 'import-file' && ev.target.files[0]) importProgress(ev.target.files[0]);
});

// Keyboard, for desktop: space or enter reveals, 1 2 3 grade.
document.addEventListener('keydown', ev => {
  const state = view.name === 'round' ? round : view.name === 'journey' ? trip : null;
  if (!state || ev.metaKey || ev.ctrlKey) return;
  if (!state.revealed && (ev.key === ' ' || ev.key === 'Enter')) {
    ev.preventDefault();
    state.revealed = true;
    render();
  } else if (state.revealed && ['1', '2', '3'].includes(ev.key)) {
    const g = ['missed', 'shaky', 'knew'][ev.key - 1];
    if (state === trip) onTripGrade(g); else onGrade(g);
  }
});

// iOS suspends a home screen app rather than closing it, so a reopened app can
// be days old. After a long pause, reload to pick up any update (never mid-round);
// after a short one, just refresh the home view in case the day has changed.
const RELOAD_AFTER = 60 * 60 * 1000; // one hour
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (['round', 'peek', 'journey', 'duel', 'sky'].includes(view.name)) return;
  if (hiddenAt && Date.now() - hiddenAt > RELOAD_AFTER) location.reload();
  else if (view.name === 'home') render();
});

/* ---------- Start ---------- */
async function init() {
  applyNight();
  try {
    const ids = await (await fetch('decks/index.json')).json();
    const loaded = await Promise.all(ids.map(id =>
      fetch(`decks/${id}.json`).then(r => (r.ok ? r.json() : null)).catch(() => null)
    ));
    decks = loaded.filter(Boolean);
  } catch {
    decks = [];
  }
  for (const d of decks) {
    for (const c of d.cards) {
      cardIndex.set(c.id, { card: c, deck: d });
      if (canReverse(d, c)) cardIndex.set(c.id + REV, { card: c, deck: d });
    }
  }
  buildLinks();
  // Load every map the decks use; fetching them also stores them for offline use.
  const mapNames = [...new Set(decks.flatMap(d => d.cards.map(c => c.map).filter(Boolean)))];
  await Promise.all(mapNames.map(name =>
    fetch(`maps/${name}.svg`).then(r => (r.ok ? r.text() : null)).then(svg => { if (svg) mapSvgs[name] = svg; }).catch(() => {})
  ));
  if (!decks.length) {
    $app.innerHTML = '<p class="loading">The decks could not be loaded. Check the connection and open Almanac again.</p>';
    return;
  }
  render();
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js');
}
init();
</script>
