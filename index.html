<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almanac</title>
<meta name="description" content="A calm recall trainer for capitals and general knowledge.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanac">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f1e8;
    --card: #fbf8f1;
    --ink: #1d232b;
    --muted: #6d675b;
    --rule: #e0d8c7;
    --accent: #a8432c;
    --knew: #3e6b4b;
    --shaky: #9a6d14;
    --knob: #ffffff;
    --sea: #dfe5e3;
    --land: #e3d8c4;
    --done-knew: #b8cdb4;
    --done-shaky: #e3cd94;
    --done-missed: #e2b1a2;
    --serif: "IBM Plex Serif", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171b;
      --card: #1c2025;
      --ink: #ebe5d9;
      --muted: #9b9486;
      --rule: #2d3239;
      --accent: #e07a5f;
      --knew: #7fb08c;
      --shaky: #d9a945;
      --knob: #ebe5d9;
      --sea: #1b252b;
      --land: #3b4047;
      --done-knew: #44604a;
      --done-shaky: #6b5a2c;
      --done-missed: #6e3d31;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app {
    max-width: 34rem;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      max(16px, env(safe-area-inset-right))
      calc(env(safe-area-inset-bottom) + 20px)
      max(16px, env(safe-area-inset-left));
  }
  .loading { margin: auto; color: var(--muted); font: italic 1rem var(--serif); text-align: center; }

  .label {
    font: 600 0.72rem/1.4 var(--sans);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .btn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    font-weight: 600;
    background: var(--ink);
    color: var(--paper);
  }
  .btn.quiet { background: transparent; border: 1px solid var(--rule); color: var(--ink); }
  .stack { display: grid; gap: 10px; margin-top: 28px; }
  .back {
    align-self: flex-start;
    background: none;
    border: 0;
    padding: 6px 0;
    margin-bottom: 14px;
    color: var(--muted);
  }
  .pagetitle { font: 500 1.9rem/1.15 var(--serif); margin: 0 0 6px; }
  .lede { color: var(--muted); margin: 0 0 24px; }

  /* Home */
  .masthead {
    text-align: center;
    padding: 10px 0 16px;
    border-bottom: 3px double var(--rule);
    margin-bottom: 24px;
  }
  .masthead h1 {
    font: 500 2.1rem/1 var(--serif);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0 0 0 0.16em;
  }
  .masthead .date { font: italic 0.95rem var(--serif); color: var(--muted); margin-top: 8px; }

  .today {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 30px;
  }
  .today h2 { font: 500 1.3rem var(--serif); margin: 0 0 2px; }
  .today p { margin: 0 0 16px; color: var(--muted); }
  .today p:last-child { margin-bottom: 0; }

  .deck {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--rule);
  }
  .deck:last-of-type { border-bottom: 1px solid var(--rule); }
  .deck .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
  .deck .title { font: 500 1.08rem var(--serif); }
  .deck .meta { font-size: 0.85rem; color: var(--muted); }
  .bar {
    display: flex;
    height: 5px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--rule);
    margin: 8px 0 6px;
  }
  .bar .s { background: var(--ink); }
  .bar .l { background: var(--accent); opacity: 0.75; }

  .switch {
    flex: none;
    position: relative;
    width: 46px;
    height: 28px;
    border-radius: 14px;
    border: 0;
    padding: 0;
    background: var(--rule);
    transition: background 0.2s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--knob);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s;
  }
  .switch[aria-checked="true"] { background: var(--knew); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }

  .foot { margin-top: auto; padding-top: 32px; text-align: center; }
  .link { background: none; border: 0; color: var(--muted); padding: 8px 12px; text-decoration: underline; text-underline-offset: 3px; }

  /* Round */
  .round { flex: 1; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; }
  .close { background: none; border: 0; font-size: 1.7rem; line-height: 1; padding: 4px 10px; margin-left: -10px; color: var(--muted); }
  .track { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--ink); transition: width 0.3s; }
  .count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }

  .face {
    flex: 1;
    display: flex;
    flex-direction: column;
    text-align: center;
    padding: 12vh 4px 24px;
  }
  .face[data-action] { cursor: pointer; }
  .face .prompt { font: 500 clamp(2rem, 9vw, 2.8rem)/1.15 var(--serif); margin-top: 4px; overflow-wrap: anywhere; }
  /* Long prompts and answers (clues, phrases) step down so they read as sentences. */
  .face .prompt.long { font-size: 1.65rem; line-height: 1.3; }
  .face .prompt.longer { font-size: 1.35rem; line-height: 1.4; }
  .face .answer.long { font-size: 1.55rem; line-height: 1.3; }
  .face .answer.longer { font-size: 1.3rem; line-height: 1.4; }
  .face .context { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }

  /* The daily five */
  .daily {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px 16px 14px 20px;
    margin-bottom: 12px;
  }
  .daily h2 { font: 500 1.1rem var(--serif); margin: 0; }
  .daily p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
  .daily .btn { width: auto; padding: 10px 16px; flex: none; }
  .daily .pair { display: flex; gap: 8px; flex: none; }
  .dots { letter-spacing: 0.12em; font-size: 1.15rem; }
  .dots.big { font-size: 2rem; margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 2px 8px; letter-spacing: 0; }
  .dots .knew, .result.knew { color: var(--knew); }
  .dots .shaky, .result.shaky { color: var(--shaky); }
  .dots .missed, .result.missed { color: var(--accent); }
  .daily-entry { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); }
  .result { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 1.2rem; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 28px);
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
  }

  /* Overland journeys */
  .linkrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 13px 18px 13px 20px;
    margin-bottom: 12px;
    font: 500 1.05rem var(--serif);
    text-align: left;
  }
  .linkrow span:last-child { color: var(--muted); font-size: 1.3rem; line-height: 1; }
  .journey-entry { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); }
  .journey-entry .dots { font-size: 0.85rem; letter-spacing: 0.06em; }
  .map.end { margin: 4px 0 18px; }
  .map.world .country.done { fill: var(--done-knew); }
  .map.world .country.done.shaky { fill: var(--done-shaky); }
  .map.world .country.done.missed { fill: var(--done-missed); }
  .map.world .labels text {
    font-family: var(--sans);
    font-weight: 600;
    fill: var(--ink);
    text-anchor: middle;
    dominant-baseline: middle;
    paint-order: stroke;
    stroke: var(--land);
    stroke-width: 0.25em;
    stroke-linejoin: round;
  }

  /* Tonight's sky: the dome is always a night sky, in either theme. Text sizes are
     divided by the zoom (--z), so labels keep their size on screen as you zoom in. */
  .sky-dome {
    --sky-bg: #0d1626; --sky-edge: #36465e; --sky-line: #8fb3ff; --sky-label: #e9e4d8;
    --sky-planet: #ffd98a; --sky-dso: #c9b8ff; --moon-lit: #f3efe2; --moon-dark: #2b3445;
  }
  .facing { margin: 0 0 12px; }
  .sky-dome svg { display: block; width: 100%; height: auto; max-height: 70vh; margin: 0 auto; touch-action: manipulation; }
  .sky-dome .dome { fill: var(--sky-bg); stroke: var(--sky-edge); stroke-width: 3; }
  .sky-dome .ring-alt { fill: none; stroke: var(--sky-label); stroke-opacity: 0.1; stroke-width: 1.5; stroke-dasharray: 8 8; vector-effect: non-scaling-stroke; }
  .sky-dome .cardinal { fill: var(--muted); font: 600 calc(35px / var(--z, 1)) var(--sans); text-anchor: middle; dominant-baseline: middle; }
  .sky-dome .figure { stroke: var(--sky-line); stroke-opacity: 0.32; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
  .sky-dome .con-name { fill: var(--sky-line); fill-opacity: 0.6; font: italic calc(24px / var(--z, 1)) var(--serif); text-anchor: middle; }
  .sky-dome .star-name { fill: var(--sky-label); fill-opacity: 0.78; font: calc(22px / var(--z, 1)) var(--sans); dominant-baseline: middle; }
  .sky-dome .planet { stroke: var(--sky-bg); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .sky-dome .planet-name { fill: var(--sky-planet); font: 600 calc(26px / var(--z, 1)) var(--sans); dominant-baseline: middle; }
  .sky-dome .moon-dark { fill: var(--moon-dark); }
  .sky-dome .moon-lit { fill: var(--moon-lit); }
  .sky-dome .dso-sym { fill: none; stroke: var(--sky-dso); stroke-opacity: 0.7; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
  .sky-dome .dso-sym.dotted { stroke-dasharray: 2 2.5; }
  .sky-dome .dso-dark { fill: #000; fill-opacity: 0.5; }
  .sky-dome .dso-name { fill: var(--sky-dso); fill-opacity: 0.8; font: calc(19px / var(--z, 1)) var(--sans); text-anchor: middle; dominant-baseline: hanging; }
  .sky-dome .hit { fill: transparent; cursor: pointer; }
  .sky-layers { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .sky-layers button { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; color: var(--muted); }
  .sky-layers button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sky-tools { display: flex; gap: 8px; margin: 12px 0 0; }
  .sky-tools .btn { flex: 1; padding: 11px; }
  .sky-red { border: 1px solid var(--rule); background: none; border-radius: 10px; padding: 0 14px; font-weight: 600; color: var(--accent); flex: none; }
  .sky-red[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .sky-time { display: flex; align-items: center; gap: 14px; margin: 14px 0 6px; }
  .sky-time span { font: 500 1.05rem var(--serif); min-width: 4.6em; font-variant-numeric: tabular-nums; }
  .sky-time input { flex: 1; accent-color: var(--accent); }
  .sky-hint { color: var(--muted); font-size: 0.88rem; text-align: center; margin: 10px 0; }
  .sky-pick { position: relative; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin: 10px 0; background: var(--card); }
  .sky-pick h3 { font: 500 1.2rem var(--serif); margin: 0 28px 0 0; }
  .sky-pick .kind { color: var(--muted); font-size: 0.85rem; margin: 0 0 6px; }
  .sky-pick p { margin: 0 0 8px; }
  .sky-unpick { position: absolute; top: 6px; right: 8px; background: none; border: 0; font-size: 1.4rem; line-height: 1; color: var(--muted); padding: 4px 6px; }
  .up-row { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 11px 0; }
  .up-row b { display: block; font: 500 1.02rem var(--serif); }
  .up-row span { color: var(--muted); font-size: 0.9rem; }

  /* Full screen: the dome fills what the controls leave. */
  .sky-full {
    position: fixed; inset: 0; z-index: 10; background: var(--paper);
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  .sky-full-top { display: flex; align-items: center; gap: 10px; }
  .sky-full-top .close { margin-left: -6px; }
  .sky-full-top .facing { flex: 1; margin: 0; }
  .sky-full-top .facing button { padding: 8px 0; }
  .sky-full-top .sky-red { align-self: stretch; }
  .sky-dome.full { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .sky-dome.full svg { width: 100%; height: 100%; max-height: none; touch-action: none; }
  .sky-sheet { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 112px); max-height: 42vh; overflow: auto; }
  .sky-sheet .sky-pick { margin: 0; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  .sky-full-bottom .sky-time { margin: 6px 0 8px; }
  .sky-full-bottom .sky-layers { margin: 0; justify-content: center; }

  /* Red light: dim red on black everywhere, kind to dark-adapted eyes. */
  :root[data-night="on"] {
    --paper: #090000; --card: #140303; --ink: #d9402f; --muted: #8a2a1f; --rule: #2e0a06;
    --accent: #ff4433; --knew: #b8392a; --shaky: #a8452c; --knob: #7a1d14;
    --sea: #140303; --land: #2c0905; --done-knew: #4a120c; --done-shaky: #561a0e; --done-missed: #3c0d08;
    color-scheme: dark;
  }
  :root[data-night="on"] .sky-dome {
    --sky-bg: #050000; --sky-edge: #3a0a06; --sky-line: #a3271b; --sky-label: #c43a2c;
    --sky-planet: #ff5a3c; --sky-dso: #b2301f; --moon-lit: #d63b2a; --moon-dark: #2a0703;
  }
  :root[data-night="on"] .sky-pick, :root[data-night="on"] .sky-sheet .sky-pick { box-shadow: none; }

  /* Your month */
  .month-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .month-head .pagetitle { margin: 0; text-align: center; flex: 1; }
  .month-nav { background: none; border: 1px solid var(--rule); border-radius: 10px; width: 40px; height: 40px; font-size: 1.3rem; color: var(--ink); }
  .month-nav:disabled { opacity: 0.3; cursor: default; }
  .month-head + .lede { text-align: center; margin-top: 4px; }
  .month-deck { border-top: 1px solid var(--rule); padding: 14px 0 10px; }
  .month-deck-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .month-deck-head b { font: 500 1.08rem var(--serif); }
  .month-deck-head span { color: var(--muted); font-size: 0.88rem; white-space: nowrap; }
  .month-deck .label { margin: 10px 0 6px; }
  .chips.left { justify-content: flex-start; }
  .month-line { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; border-top: 1px solid var(--rule); padding: 10px 0; text-align: left; }

  /* Which came first? */
  .duel { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 4vh; }
  .duel .label { text-align: center; }
  .duel-choice {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 18px 14px;
  }
  .duel-choice.right { border-color: var(--knew); box-shadow: inset 0 0 0 1px var(--knew); }
  .duel-choice.wrong { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .duel-year { font: 500 1.5rem/1 var(--serif); color: var(--accent); }
  .duel-choice.right .duel-year { color: var(--knew); }
  .duel-title { font: 500 1.25rem/1.25 var(--serif); }
  .duel-text { color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
  .duel-choice small { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
  .duel-verdict { font: italic 1rem/1.5 var(--serif); color: var(--muted); text-align: center; margin: 6px 4px 0; }
  .muted { color: var(--muted); font-size: 0.9em; }

  /* Rabbit holes */
  .related { margin-top: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid var(--rule);
    background: var(--card);
    border-radius: 12px;
    padding: 7px 14px 6px;
    font: 500 0.92rem/1.25 var(--serif);
  }
  .chip small { font: 400 0.72rem/1.3 var(--sans); color: var(--muted); }
  .face.peek { padding-top: 2vh; }
  .deckname { font-size: 0.85rem; color: var(--muted); margin: 0 0 14px; }

  /* Map cards */
  .face.has-map { padding-top: 3vh; }
  .map { margin-top: 10px; }
  .map svg { display: block; width: 100%; height: auto; max-height: 52vh; border-radius: 10px; }
  .map .sea { fill: var(--sea); }
  .map .land { fill: var(--land); stroke: var(--paper); stroke-width: 0.8; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .map .country.on { fill: var(--accent); }
  .map .ring { fill: none; stroke: none; }
  .map .ring.on { stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .map-missing { color: var(--muted); font-style: italic; padding: 40px 0; }
  .face .again { color: var(--accent); font-size: 0.8rem; font-weight: 600; margin-top: 6px; }
  .face .answer {
    font: 400 clamp(1.8rem, 8vw, 2.4rem)/1.2 var(--serif);
    color: var(--accent);
    margin-top: 28px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
    overflow-wrap: anywhere;
    animation: rise 0.25s ease-out;
  }
  .face .note {
    font: italic 1rem/1.55 var(--serif);
    color: var(--muted);
    margin: 16px auto 0;
    max-width: 26rem;
    animation: rise 0.35s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .actions .btn { grid-column: 1 / -1; }
  .grade {
    border: 1px solid var(--rule);
    background: var(--card);
    border-radius: 12px;
    padding: 16px 6px;
    font-weight: 600;
  }
  .grade.missed { color: var(--accent); }
  .grade.shaky { color: var(--shaky); }
  .grade.knew { color: var(--knew); }

  /* Summary */
  .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 30px; }
  .tally div { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 8px; text-align: center; }
  .tally b { display: block; font: 500 1.8rem/1.1 var(--serif); font-variant-numeric: tabular-nums; }
  .tally span { font-size: 0.82rem; color: var(--muted); }

  /* Entries (browse and summary) */
  .entry {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 12px;
    padding: 13px 0;
    border-top: 1px solid var(--rule);
  }
  .entry .p { font: 500 1.05rem var(--serif); }
  .entry .a { color: var(--accent); font: 400 1.05rem var(--serif); }
  .entry .n { grid-column: 1 / -1; font: italic 0.92rem/1.5 var(--serif); color: var(--muted); margin-top: 4px; }
  .dot { grid-column: 2; grid-row: 1 / 3; align-self: center; width: 9px; height: 9px; border-radius: 50%; background: transparent; border: 1.5px solid var(--rule); }
  .dot.learning { background: var(--accent); border-color: var(--accent); opacity: 0.75; }
  .dot.settled { background: var(--ink); border-color: var(--ink); }
  .group { margin: 26px 0 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { display: inline-block; }

  /* Settings */
  .setting { padding: 16px 0; border-top: 1px solid var(--rule); }
  .setting h3 { font: 500 1.05rem var(--serif); margin: 0; }
  .setting p { margin: 2px 0 0; font-size: 0.88rem; color: var(--muted); }
  .setting.row { display: flex; align-items: center; gap: 14px; }
  .setting.row > div { flex: 1; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 0; font-variant-numeric: tabular-nums; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .about { font: 1rem/1.6 var(--serif); color: var(--muted); }
  .about p { margin: 0 0 12px; }
</style>
</head>
<body>
<main id="app"><p class="loading">Opening the almanac…</p></main>
<script src="sky/astro.js"></script>

<script>
'use strict';

/* ---------- Scheduling constants (see CLAUDE.md) ---------- */
const STORE_KEY = 'almanac.v1';
const INTERVALS = [0, 1, 3, 7, 16, 35, 75, 150]; // days until next sighting, by box
const SETTLED_BOX = 4;     // 16+ days counts as settled
const FIRST_KNEW_BOX = 3;  // knew it on first sighting: already known
const REQUEUE_GAP = 4;     // a missed card returns this many cards later

let decks = [];
const cardIndex = new Map(); // card id -> { card, deck }
const mapSvgs = {};          // map name -> SVG markup
let store = loadStore();
let view = { name: 'home' };
let round = null;
const $app = document.getElementById('app');

/* ---------- Storage ---------- */
function defaultStore() {
  return { v: 1, cards: {}, daily: {}, journeys: {},
           settings: { size: 15, fresh: 5, notes: true, off: {}, revOff: {}, night: false, skyLayers: {} } };
}
function normalise(s) {
  const d = defaultStore();
  if (!s || typeof s !== 'object') return d;
  const set = s.settings || {};
  return {
    v: 1,
    cards: s.cards && typeof s.cards === 'object' ? s.cards : {},
    daily: s.daily && typeof s.daily === 'object' ? s.daily : {},
    journeys: s.journeys && typeof s.journeys === 'object' ? s.journeys : {},
    settings: { ...d.settings, ...set, off: { ...set.off }, revOff: { ...set.revOff }, skyLayers: { ...set.skyLayers } },
  };
}
function loadStore() {
  try { return normalise(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch { return defaultStore(); }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch { /* storage unavailable */ }
}

/* ---------- Helpers ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pct(n, total) { return total ? (100 * n / total).toFixed(2) : 0; }
// Local calendar day number, so "tomorrow" means after midnight here.
function today() {
  const now = new Date();
  return Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
}
function status(id) {
  const s = store.cards[id];
  if (!s) return 'unseen';
  return s.b >= SETTLED_BOX ? 'settled' : 'learning';
}
function activeDecks() { return decks.filter(d => !store.settings.off[d.id]); }

/* ---------- Reverse direction ---------- */
// A reversed card is its own card, with id = forward id + REV and its own schedule.
const REV = '~r';
const REVERSE_UNLOCK_BOX = 2; // a reversed card appears once the forward one has been known
function baseId(id) { return id.endsWith(REV) ? id.slice(0, -REV.length) : id; }
function plain(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
// Pointless when one side gives the other away: Durango, Monaco, Kuwait City, Indianapolis.
function canReverse(deck, card) {
  if (!deck.reversible || card.noReverse) return false;
  const p = plain(card.prompt), a = plain(card.answer);
  return !a.includes(p) && !p.includes(a);
}
function reverseOn(deck) { return deck.reversible && !store.settings.revOff[deck.id]; }
function reverseCards(deck) { return reverseOn(deck) ? deck.cards.filter(c => canReverse(deck, c)) : []; }

function deckStats(deck) {
  const st = { settled: 0, learning: 0, total: deck.cards.length, rsettled: 0, rseen: 0, rtotal: 0 };
  for (const c of deck.cards) {
    const k = status(c.id);
    if (k !== 'unseen') st[k]++;
  }
  for (const c of reverseCards(deck)) {
    const k = status(c.id + REV);
    st.rtotal++;
    if (k !== 'unseen') st.rseen++;
    if (k === 'settled') st.rsettled++;
  }
  return st;
}

/* ---------- Scheduling ---------- */
function grade(id, g) {
  const t = today();
  const s = store.cards[id];
  let b;
  if (g === 'knew') b = s ? Math.min(s.b + 1, INTERVALS.length - 1) : FIRST_KNEW_BOX;
  else if (g === 'shaky') b = s ? Math.max(1, s.b - 1) : 1;
  else b = 1;
  // f: the day first met; s: the day first settled (kept even if it later slips back).
  const rec = { b, d: t + INTERVALS[b], n: (s ? s.n : 0) + 1, l: t, f: s ? cardDates(s).first : t };
  const settledBefore = s ? cardDates(s).settled : null;
  if (settledBefore != null) rec.s = settledBefore;
  else if (b >= SETTLED_BOX) rec.s = t;
  store.cards[id] = rec;
  saveStore();
}

// Which cards the next round would hold: due cards first (most overdue first),
// then new cards, taken in turn from each source (every active deck's forward
// cards, and its unlocked reversed cards) in that deck's own order.
// The two directions of one item never share a round, so neither gives the other away.
function plan() {
  const t = today();
  const { size, fresh } = store.settings;
  const due = [];
  const sources = [];
  for (const d of activeDecks()) {
    const fwd = [];
    const rev = [];
    for (const c of d.cards) {
      const s = store.cards[c.id];
      if (!s) fwd.push(c.id);
      else if (s.d <= t) due.push(c.id);
    }
    for (const c of reverseCards(d)) {
      const s = store.cards[c.id];
      const r = store.cards[c.id + REV];
      if (r) { if (r.d <= t) due.push(c.id + REV); }
      else if (s && s.b >= REVERSE_UNLOCK_BOX) rev.push(c.id + REV);
    }
    sources.push(fwd, rev);
  }

  const used = new Set();
  const take = (id, into) => {
    if (used.has(baseId(id))) return;
    used.add(baseId(id));
    into.push(id);
  };

  shuffle(due).sort((a, b) => store.cards[a].d - store.cards[b].d);
  const picked = [];
  for (const id of due) {
    if (picked.length >= size) break;
    take(id, picked);
  }

  const room = Math.min(fresh, size - picked.length);
  const newOnes = [];
  // Deal from the decks in a random order, so with more decks than new-card
  // slots the decks late in the list still get their turn.
  shuffle(sources);
  for (let i = 0; newOnes.length < room; i++) {
    let more = false;
    for (const src of sources) {
      if (i < src.length) {
        more = true;
        if (newOnes.length < room) take(src[i], newOnes);
      }
    }
    if (!more) break;
  }
  return { due: picked, fresh: newOnes };
}

function nextDueText() {
  const t = today();
  let next = Infinity;
  for (const d of activeDecks()) {
    const ids = [...d.cards.map(c => c.id), ...reverseCards(d).map(c => c.id + REV)];
    for (const id of ids) {
      const s = store.cards[id];
      if (s && s.d > t && s.d < next) next = s.d;
    }
  }
  if (next === Infinity) return '';
  const days = next - t;
  if (days === 1) return 'The next card comes back tomorrow.';
  if (days < 7) {
    const when = new Date(Date.now() + days * 86400000).toLocaleDateString('en-NZ', { weekday: 'long' });
    return `The next card comes back on ${when}.`;
  }
  return `The next card comes back in ${days} days.`;
}

/* ---------- Rabbit holes ---------- */
// Links between cards, found when the app loads: the same thing in another deck
// (France the capital card, France on the map, the Eiffel Tower), or a note
// that names another card (the Ares note mentions Phobos and Deimos).
const links = new Map(); // forward card id -> up to MAX_LINKS of { id, term, same }
const MAX_LINKS = 3;

// The names a card is known by: its answer and prompt, split at " · ",
// without parentheses, skipping numbers and very short words (Io, Ra, Set).
function termsOf(card) {
  const out = [];
  for (const side of card.map ? [card.answer] : [card.answer, card.prompt]) {
    for (const part of String(side).split(' · ')) {
      const t = part.replace(/\s*\([^)]*\)/g, '').trim();
      if (t.length >= 4 && !/\d/.test(t)) out.push(t);
    }
  }
  return out;
}

function buildLinks() {
  const order = new Map(decks.map((d, i) => [d.id, i]));
  const same = new Map();   // plain term -> card ids
  const named = new Map();  // exact proper name -> card ids
  const add = (m, k, id) => { if (!m.has(k)) m.set(k, []); m.get(k).push(id); };
  for (const d of decks) {
    for (const c of d.cards) {
      for (const t of termsOf(c)) {
        add(same, plain(t), c.id);
        if (/^\p{Lu}/u.test(t) && t.split(' ').length <= 4) add(named, t, c.id);
      }
    }
  }
  for (const d of decks) {
    for (const c of d.cards) {
      const found = new Map(); // id -> { term, same: true for the same thing, false for a mention }
      for (const t of termsOf(c)) {
        for (const id of same.get(plain(t)) || []) if (!found.has(id)) found.set(id, { term: t, same: true });
      }
      // Mentions: a name standing on its own in the note. A name inside a longer
      // one does not count ("Nelson Mandela" is not Nelson), though a capitalised
      // word that merely starts a sentence ("When Belisarius...") is ignored.
      const note = c.note || '';
      const tokens = [...note.matchAll(/[\p{L}\p{M}'’-]+/gu)].map(m => {
        const before = note.slice(0, m.index).trimEnd();
        return { w: m[0].replace(/['’]s$/, ''), cap: /^\p{Lu}/u.test(m[0]), start: !before || /[.!?;:]$/.test(before) };
      });
      for (let i = 0; i < tokens.length; i++) {
        for (let n = 1; n <= 4 && i + n <= tokens.length; n++) {
          const ids = named.get(tokens.slice(i, i + n).map(t => t.w).join(' '));
          if (!ids) continue;
          const prev = tokens[i - 1];
          const next = tokens[i + n];
          if ((prev && prev.cap && !prev.start) || (next && next.cap)) continue;
          for (const id of ids) if (!found.has(id)) found.set(id, { term: tokens.slice(i, i + n).map(t => t.w).join(' '), same: false });
        }
      }
      found.delete(c.id);
      // Same-thing links first, then mentions; spread across decks where possible.
      const ranked = [...found].sort((a, b) =>
        b[1].same - a[1].same || order.get(cardIndex.get(a[0]).deck.id) - order.get(cardIndex.get(b[0]).deck.id));
      // Never two buttons with the same text (two Horus cards read as one link).
      const picked = [];
      const decksUsed = new Set();
      const texts = new Set();
      const take = link => { picked.push(link); texts.add(chipText(link)); };
      for (const [id, how] of ranked) {
        const link = { id, ...how };
        const deckId = cardIndex.get(id).deck.id;
        if (picked.length < MAX_LINKS && !decksUsed.has(deckId) && !texts.has(chipText(link))) { take(link); decksUsed.add(deckId); }
      }
      for (const [id, how] of ranked) {
        const link = { id, ...how };
        if (picked.length < MAX_LINKS && !picked.some(p => p.id === id) && !texts.has(chipText(link))) take(link);
      }
      if (picked.length) links.set(c.id, picked);
    }
  }
}

// How a linked card is named on its button. A mention shows the name that was
// mentioned (Phobos). The same thing elsewhere shows the card's other side, so
// Zeus leads to "Jupiter", and a namesake reads as one ("Trojan prince who
// carried off Helen", not a second "Paris").
function chipText(link) {
  const { card, deck } = cardIndex.get(link.id);
  if (card.map) return `${card.answer} on the map`;
  if (deck.chip === 'prompt') return card.prompt; // e.g. landmarks: name the landmark, not its country
  const key = plain(link.term);
  const inPrompt = plain(card.prompt).includes(key);
  const other = inPrompt ? card.answer : card.prompt;
  const usable = other.length <= 40 && !/^\d+$/.test(other) && !plain(other).includes(key);
  return (inPrompt || link.same) && usable ? other : link.term;
}

function relatedHtml(id) {
  const found = links.get(baseId(id)) || [];
  if (!found.length) return '';
  return `<div class="related"><p class="label">Related</p><div class="chips">${found.map(link =>
    `<button class="chip" data-action="peek" data-id="${esc(link.id)}">${esc(chipText(link))}<small>${esc(cardIndex.get(link.id).deck.title)}</small></button>`
  ).join('')}</div></div>`;
}

/* ---------- The daily five ---------- */
// Five cards chosen from the date alone, so everyone gets the same five that day.
// It never touches the spaced repetition schedule.
const DAILY_SIZE = 5;
const DOT = { knew: '●', shaky: '◐', missed: '○' };

function dayKey(date = new Date()) { return date.toLocaleDateString('en-CA'); } // YYYY-MM-DD, local

// A repeatable random sequence from a text seed (FNV-1a hash, then mulberry32).
function seededRandom(text) {
  let h = 2166136261;
  for (const ch of text) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
  return () => {
    h = (h + 0x6D2B79F5) | 0;
    let t = Math.imul(h ^ (h >>> 15), h | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dailyCards(key) {
  const rnd = seededRandom('almanac:' + key);
  const pool = [...decks].sort((a, b) => (a.id < b.id ? -1 : 1));
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, DAILY_SIZE).map(d => d.cards[Math.floor(rnd() * d.cards.length)].id);
}

function dots(results) {
  return results.map(g => `<span class="${g}">${DOT[g]}</span>`).join('');
}

function startDaily() {
  const key = dayKey();
  round = { daily: key, queue: dailyCards(key).map(id => ({ id, tries: 0 })), i: 0, revealed: false, results: [] };
  go('round');
}

function finishDaily() {
  store.daily[round.daily] = round.results;
  // Keep about four months of results.
  for (const k of Object.keys(store.daily).sort().slice(0, -120)) delete store.daily[k];
  saveStore();
  go('daily', { key: round.daily });
}

function longDate(key) {
  return new Date(key + 'T12:00').toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' });
}

async function shareDaily(key) {
  const res = store.daily[key];
  if (!res) return;
  const day = new Date(key + 'T12:00').toLocaleDateString('en-NZ', { day: 'numeric', month: 'long' });
  const text = `Almanac · ${day}\n${res.map(g => DOT[g]).join('')}`;
  const url = location.origin + location.pathname;
  if (navigator.share) {
    try { await navigator.share({ text, url }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); flash('Copied, ready to paste'); }
  catch { window.prompt('Copy this:', `${text}\n${url}`); }
}

function flash(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.append(el);
  setTimeout(() => el.remove(), 2200);
}

/* ---------- Overland journeys ---------- */
// Name each country as it lights up along a route on the world map. Like the
// daily five, journeys never touch the schedule. The world map, borders and
// routes are loaded the first time the Journeys page opens.
let world = null; // { svg, width, height, countries: { id: { box, label, near } }, routes }
let trip = null;  // { route, i, revealed, results }

async function loadWorld() {
  const [svg, meta, routes] = await Promise.all([
    fetch('maps/world.svg').then(r => r.text()),
    fetch('maps/world.json').then(r => r.json()),
    fetch('maps/journeys.json').then(r => r.json()),
  ]);
  world = { svg, ...meta, routes };
}

async function openJourneys() {
  if (!world) {
    $app.innerHTML = '<p class="loading">Unfolding the world map…</p>';
    try { await loadWorld(); }
    catch {
      $app.innerHTML = `<p class="loading">The world map has not been downloaded yet; open Journeys once while online.</p>
        <div class="stack"><button class="btn quiet" data-action="home">Back to the almanac</button></div>`;
      return;
    }
  }
  go('journeys');
}

const countryName = id => cardIndex.get(id).card.prompt;
const capitalOf = id => cardIndex.get(id).card.answer;

// Two countries on the same landmass, 6 to 12 countries apart overland, joined by
// a shortest route (neighbours shuffled, so equally short routes vary).
function surpriseRoute() {
  const meta = world.countries;
  const ids = Object.keys(meta).filter(id => meta[id].near.length);
  for (let attempt = 0; attempt < 50; attempt++) {
    const start = ids[Math.floor(Math.random() * ids.length)];
    const prev = new Map([[start, null]]);
    const dist = new Map([[start, 0]]);
    const queue = [start];
    while (queue.length) {
      const a = queue.shift();
      for (const b of shuffle([...meta[a].near])) {
        if (!dist.has(b)) { dist.set(b, dist.get(a) + 1); prev.set(b, a); queue.push(b); }
      }
    }
    const far = [...dist].filter(([, d]) => d >= 5 && d <= 11).map(([id]) => id);
    if (!far.length) continue;
    const path = [];
    for (let c = far[Math.floor(Math.random() * far.length)]; c; c = prev.get(c)) path.unshift(c);
    return { id: 'surprise', title: 'A surprise journey', countries: path,
             story: `From ${countryName(path[0])} to ${countryName(path[path.length - 1])}, overland.` };
  }
  return null;
}

function startJourney(route) {
  if (!route) return;
  trip = { route, i: 0, revealed: false, results: [] };
  go('journey');
}

// The map window for a route: the union of its countries' boxes. A country far
// bigger than the rest of the route (Russia on the way to Moscow, China at the
// head of the Mekong) only pulls the window a little way towards itself.
function routeWindow(ids, minWidth = 40, minAspect = 0.55) {
  const boxes = ids.map(id => world.countries[id].box);
  const union = bs => bs.reduce((u, b) => [Math.min(u[0], b[0]), Math.min(u[1], b[1]), Math.max(u[2], b[2]), Math.max(u[3], b[3])],
                                [Infinity, Infinity, -Infinity, -Infinity]);
  const area = b => (b[2] - b[0]) * (b[3] - b[1]);
  let core = boxes;
  const huge = [];
  for (const b of boxes) {
    const others = core.filter(o => o !== b);
    if (others.length && area(b) > 3 * area(union(others))) { core = others; huge.push(b); }
  }
  let [x0, y0, x1, y1] = union(core);
  for (const b of huge) {
    const w = x1 - x0, h = y1 - y0;
    x0 = Math.max(Math.min(x0, b[0]), x0 - 0.35 * w); x1 = Math.min(Math.max(x1, b[2]), x1 + 0.35 * w);
    y0 = Math.max(Math.min(y0, b[1]), y0 - 0.35 * h); y1 = Math.min(Math.max(y1, b[3]), y1 + 0.35 * h);
  }
  // A margin, a minimum size, and not too letterboxed for a phone.
  let w = Math.max(x1 - x0, minWidth), h = Math.max(y1 - y0, minWidth * 0.6);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  w *= 1.15; h *= 1.15;
  if (h < minAspect * w) h = minAspect * w;
  return [cx - w / 2, cy - h / 2, w, h];
}

// Light up the journey on the inlined world map: countries done so far tinted by
// how you did and labelled with their names, the current one in the accent colour.
// During play the window follows you, framing the last two countries and the
// current one; at the end it pulls back to the whole route.
function decorateTrip(showAll) {
  const svg = $app.querySelector('.map.world svg');
  if (!svg) return;
  const route = trip.route.countries;
  const [vx, vy, vw, vh] = showAll
    ? routeWindow(route)
    : routeWindow(route.slice(Math.max(0, trip.i - 2), trip.i + 1), 110, 0.75);
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  const labels = svg.querySelector('.labels');
  const done = showAll ? trip.route.countries.length : trip.i;
  trip.route.countries.forEach((id, k) => {
    const path = svg.querySelector(`[id="${id}"]`);
    if (!path) return;
    if (k < done) {
      path.classList.add('done', trip.results[k] || 'knew');
      const { label, box } = world.countries[id];
      // The part of the country inside the window (a huge country can overflow it).
      const shown = [Math.max(box[0], vx), Math.max(box[1], vy), Math.min(box[2], vx + vw), Math.min(box[3], vy + vh)];
      let [lx, ly] = label;
      if (lx < shown[0] || lx > shown[2] || ly < shown[1] || ly > shown[3]) {
        lx = (shown[0] + shown[2]) / 2;
        ly = (shown[1] + shown[3]) / 2;
      }
      // Size the name to fit roughly within the country; leave it off if it would be unreadable.
      const name = countryName(id);
      const size = Math.min(vw / 18, (1.8 * (shown[2] - shown[0])) / (0.6 * name.length));
      if (shown[2] > shown[0] && shown[3] > shown[1] && size >= vw / 75) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', lx);
        text.setAttribute('y', ly);
        text.setAttribute('font-size', size.toFixed(2));
        text.textContent = name;
        labels.append(text);
      }
    } else if (k === done && !showAll) {
      path.classList.add('on');
    }
  });
}

function renderJourneys() {
  const rows = world.routes.map(r => {
    const last = store.journeys[r.id];
    return `<button class="entry journey-entry" data-action="journey" data-route="${esc(r.id)}">
      <div class="p">${esc(r.title)}</div>
      <span class="result">${last ? `<span class="dots">${dots(last.results)}</span>` : ''}</span>
      <div class="a">${r.countries.length} countries</div>
    </button>`;
  }).join('');
  return `<button class="back" data-action="home">‹ Almanac</button>
    <h2 class="pagetitle">Overland journeys</h2>
    <p class="lede">Cross a continent one border at a time: name each country as it lights up. Journeys never affect your rounds.</p>
    <button class="btn" data-action="journey-surprise">Surprise me</button>
    <p class="label group">Named routes</p>
    ${rows}`;
}

function renderJourney() {
  const { route, i, revealed } = trip;
  const id = route.countries[i];
  const n = route.countries.length;
  const label = i === 0 ? 'Where the journey begins' : i === n - 1 ? 'And finally' : 'Next country';
  const actions = revealed
    ? `<button class="grade missed" data-action="trip-grade" data-grade="missed">Missed</button>
       <button class="grade shaky" data-action="trip-grade" data-grade="shaky">Shaky</button>
       <button class="grade knew" data-action="trip-grade" data-grade="knew">Knew it</button>`
    : `<button class="btn" data-action="trip-reveal">Show answer</button>`;
  return `<div class="round">
    <div class="topbar">
      <button class="close" data-action="journeys" aria-label="End journey">×</button>
      <div class="track"><i style="width:${pct(i, n)}%"></i></div>
      <span class="count">${i + 1} / ${n}</span>
    </div>
    <div class="face has-map"${revealed ? '' : ' data-action="trip-reveal"'}>
      <div class="label">${esc(label)}</div>
      <div class="map world">${world.svg}</div>
      <div class="context">${esc(route.title)}</div>
      ${revealed ? `<div class="answer">${esc(countryName(id))}</div><div class="note">Capital: ${esc(capitalOf(id))}.</div>` : ''}
    </div>
    <div class="actions">${actions}</div>
  </div>`;
}

function onTripGrade(g) {
  trip.results.push(g);
  trip.i++;
  trip.revealed = false;
  if (trip.i < trip.route.countries.length) { render(); return; }
  if (trip.route.id !== 'surprise') {
    store.journeys[trip.route.id] = { day: dayKey(), results: trip.results };
    saveStore();
  }
  go('journey-end');
}

function renderJourneyEnd() {
  const { route, results } = trip;
  const items = route.countries.map((id, k) => `<div class="entry">
      <div class="p">${esc(countryName(id))}</div>
      <span class="result ${results[k]}">${DOT[results[k]]}</span>
      <div class="a">${esc(capitalOf(id))}</div>
    </div>`).join('');
  return `<h2 class="pagetitle">${esc(route.title)}</h2>
    <p class="lede">${esc(route.story)}</p>
    <div class="map world end">${world.svg}</div>
    <p class="dots big">${dots(results)}</p>
    ${items}
    <div class="stack">
      <button class="btn" data-action="journeys">Another journey</button>
      <button class="btn quiet" data-action="home">Back to the almanac</button>
    </div>`;
}

/* ---------- Tonight's sky ---------- */
// A planisphere for Auckland: the whole sky as a dome, horizon at the edge and
// the zenith in the centre (stereographic projection), turned so the direction
// you face is at the bottom. Positions come from sky/astro.js; stars from
// sky/stars.json (Yale Bright Star Catalogue), constellations from
// sky/constellations.json and deep-sky objects from sky/deepsky.json, all loaded
// the first time. Full screen adds pinch zoom and drag; layers declutter.
const SKY = { lat: -36.8485, lon: 174.7633, place: 'Auckland' };
const PLANETS = ['mercury', 'venus', 'mars', 'jupiter', 'saturn'];
const PLANET_COLOUR = { mercury: '#d9d0c1', venus: '#fffbe8', mars: '#ff9b70', jupiter: '#f4e4c4', saturn: '#eedaa2' };
const STEP = 5 * 60000; // the time slider moves in five-minute steps
const K = 500;          // chart units: the horizon circle has radius K
const HALF = 1.16 * K;  // half the width of the unzoomed view, compass letters included
const MAX_ZOOM = 10;
const LAYERS = [['lines', 'Lines'], ['names', 'Constellations'], ['stars', 'Star names'], ['deep', 'Deep sky'], ['grid', 'Grid']];
let skyData = null;
let skyState = null; // { sunset, sunrise, t, facing, pick, full, zoom: { s, x, y } }

const cap = s => s[0].toUpperCase() + s.slice(1);
const clock = d => d.toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit' }).replace(' ', ' ');
const layerOn = key => store.settings.skyLayers[key] !== false;

function compass(az) {
  return ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'][Math.round(az / 45) % 8];
}
function height(alt) {
  return alt > 75 ? 'nearly overhead' : alt > 50 ? 'high' : alt > 20 ? 'part-way up' : 'low';
}

/* Red light: the whole app in dim red on black, kindest to dark-adapted eyes. */
function applyNight() {
  const on = !!store.settings.night;
  document.documentElement.dataset.night = on ? 'on' : '';
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (!m.dataset.day) m.dataset.day = m.content;
    m.content = on ? '#090000' : m.dataset.day;
  });
}

async function loadSkyData() {
  const base = await (await fetch('sky/stars.json')).json();
  const optional = path => fetch(path).then(r => (r.ok ? r.json() : null)).catch(() => null);
  const [cons, deep] = await Promise.all([optional('sky/constellations.json'), optional('sky/deepsky.json')]);
  const stars = base.stars.concat((cons && cons.extraStars) || []);
  const figures = cons ? cons.constellations
    : base.figures.map(f => ({ ...f, meaning: null, story: null, brightest: null, cards: [] }));
  const dso = deep ? deep.objects
    : base.objects.map(o => ({ id: o.id, cat: null, alt: null, name: o.name, type: o.kind, ra: o.ra, dec: o.dec,
                               mag: null, size: [o.size * 60, o.size * 60], dist: null, con: null, note: null, card: o.card }));
  const starCon = new Map();
  for (const f of figures) for (const pair of f.lines) for (const hr of pair) if (!starCon.has(hr)) starCon.set(hr, f.abbr);
  // The 27 best-known figures are named at any zoom; the rest from twice zoom.
  const major = new Set(base.figures.map(f => f.abbr));
  return { ...base, stars, starById: new Map(stars.map(s => [s[0], s])), figures, dso, starCon, major };
}

async function openSky() {
  if (!skyData) {
    $app.innerHTML = '<p class="loading">Rolling out the star chart…</p>';
    try { skyData = await loadSkyData(); }
    catch {
      $app.innerHTML = `<p class="loading">The star chart has not been downloaded yet; open Tonight's sky once while online.</p>
        <div class="stack"><button class="btn quiet" data-action="home">Back to the almanac</button></div>`;
      return;
    }
  }
  if (!skyState) {
    // The night under way or coming: the last sunset before the next sunrise.
    const now = Date.now();
    const sunAlt = d => Astro.bodies(d, SKY.lat, SKY.lon).sun.alt;
    const cs = Astro.crossings(sunAlt, -0.833, now - 20 * 3600000, now + 30 * 3600000, 10);
    const sunrise = cs.find(c => c.rising && c.time > now).time;
    const sunset = [...cs].reverse().find(c => !c.rising && c.time < sunrise).time;
    const dark = sunset.getTime() + 90 * 60000;
    const start = now > sunset && now < sunrise ? now : dark;
    skyState = { sunset, sunrise, t: new Date(Math.round(start / STEP) * STEP), facing: 180, pick: null,
                 full: false, zoom: { s: 1, x: 0, y: 0 } };
  }
  go('sky');
}

// Chart coordinates: radius tan(zenith distance / 2), the facing direction at the bottom.
function skyXY(alt, az) {
  const r = K * Math.tan(((90 - alt) * Math.PI) / 360);
  const p = ((az - skyState.facing) * Math.PI) / 180;
  return [r * Math.sin(p), r * Math.cos(p)];
}

// An angular radius (degrees) as chart units at a given chart position: the
// stereographic scale grows from 1/2 per radian at the zenith towards the horizon.
function angularRadius(deg, x, y) {
  const r0 = Math.hypot(x, y) / K;
  return K * ((deg * Math.PI) / 180) * (1 + r0 * r0) / 2;
}

// Star colour from its B-V index, from blue-white to orange; all reds under red light.
function starColour(bv) {
  if (store.settings.night) return bv != null && bv > 1 ? '#ff5236' : '#ff3b2b';
  if (bv == null) return '#f4f1ea';
  if (bv < 0) return '#c4d6ff';
  if (bv < 0.3) return '#e8eeff';
  if (bv < 0.6) return '#fbf8ef';
  if (bv < 1.0) return '#fff1cf';
  if (bv < 1.4) return '#ffdcae';
  return '#ffc18a';
}

function phaseName(m) {
  if (m.illum < 0.03) return 'new moon';
  if (m.illum > 0.97) return 'full moon';
  if (Math.abs(m.illum - 0.5) < 0.05) return m.waxing ? 'first quarter' : 'last quarter';
  return `${m.waxing ? 'waxing' : 'waning'} ${m.illum < 0.5 ? 'crescent' : 'gibbous'}`;
}

// The Moon drawn at its phase, its bright limb turned towards the Sun.
function moonSvg(m, sun, R) {
  const [x, y] = skyXY(m.alt, m.az);
  const [sx, sy] = skyXY(sun.alt, sun.az);
  const turn = (Math.atan2(sy - y, sx - x) * 180) / Math.PI;
  const c = 1 - 2 * m.illum; // cosine of the phase angle, near enough
  const lit = `M0,${-R} A${R},${R} 0 0 1 0,${R} A${(R * Math.abs(c)).toFixed(2)},${R} 0 0 ${c < 0 ? 1 : 0} 0,${-R}Z`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${turn.toFixed(1)})">
      <circle r="${R.toFixed(1)}" class="moon-dark"/><path d="${lit}" class="moon-lit"/></g>`;
}

// Standard chart symbols: galaxy an ellipse, open cluster a dotted circle,
// globular a circle with a cross, nebula a square, planetary nebula a ringed dot.
function dsoSymbol(o, x, y, r) {
  const X = x.toFixed(1), Y = y.toFixed(1), R = r.toFixed(1);
  switch (o.type) {
    case 'galaxy': {
      const ratio = Math.max(0.35, (o.size[1] || o.size[0]) / o.size[0]);
      return `<ellipse cx="${X}" cy="${Y}" rx="${R}" ry="${(r * ratio).toFixed(1)}" transform="rotate(-30 ${X} ${Y})" class="dso-sym"/>`;
    }
    case 'globular cluster':
      return `<circle cx="${X}" cy="${Y}" r="${R}" class="dso-sym"/><path d="M${(x - r).toFixed(1)},${Y}H${(x + r).toFixed(1)}M${X},${(y - r).toFixed(1)}V${(y + r).toFixed(1)}" class="dso-sym"/>`;
    case 'open cluster': case 'asterism': case 'double star': case 'star cloud':
      return `<circle cx="${X}" cy="${Y}" r="${R}" class="dso-sym dotted"/>`;
    case 'planetary nebula':
      return `<circle cx="${X}" cy="${Y}" r="${(r * 0.6).toFixed(1)}" class="dso-sym"/><path d="M${(x - r).toFixed(1)},${Y}h${(r * 0.4).toFixed(1)}M${(x + r).toFixed(1)},${Y}h${(-r * 0.4).toFixed(1)}M${X},${(y - r).toFixed(1)}v${(r * 0.4).toFixed(1)}M${X},${(y + r).toFixed(1)}v${(-r * 0.4).toFixed(1)}" class="dso-sym"/>`;
    case 'dark nebula':
      return `<circle cx="${X}" cy="${Y}" r="${R}" class="dso-dark"/>`;
    default: // nebula, supernova remnant
      return `<rect x="${(x - r).toFixed(1)}" y="${(y - r).toFixed(1)}" width="${(2 * r).toFixed(1)}" height="${(2 * r).toFixed(1)}" rx="${(r * 0.25).toFixed(1)}" class="dso-sym"/>`;
  }
}

function viewBoxOf(zoom) {
  const h = HALF / zoom.s;
  return [zoom.x - h, zoom.y - h, 2 * h, 2 * h];
}

function skySvg() {
  const t = skyState.t;
  const zoom = skyState.full ? skyState.zoom : { s: 1, x: 0, y: 0 };
  const s = zoom.s;
  const q = 1 / Math.sqrt(s); // stars and symbols shrink a little as you zoom, so detail opens up
  const at = Astro.starProjector(t, SKY.lat, SKY.lon);
  const b = Astro.bodies(t, SKY.lat, SKY.lon);
  const stars = new Map(skyData.stars.map(([hr, ra, dec, mag, bv]) => [hr, { ...at(ra, dec), mag, bv }]));
  const parts = [];
  const pick = (kind, id) => `data-action="sky-pick" data-kind="${kind}" data-id="${id}"`;
  const hit = (x, y, r, kind, id) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r / s).toFixed(1)}" class="hit" ${pick(kind, id)}/>`;

  parts.push(`<circle r="${K}" class="dome"/>`);
  if (layerOn('grid')) {
    for (const alt of [30, 60]) parts.push(`<circle r="${(K * Math.tan(((90 - alt) * Math.PI) / 360)).toFixed(1)}" class="ring-alt"/>`);
  }
  for (const [az, name] of [[0, 'N'], [90, 'E'], [180, 'S'], [270, 'W']]) {
    const [x, y] = skyXY(-6, az);
    parts.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="cardinal">${name}</text>`);
  }
  parts.push('<g clip-path="url(#dome-clip)">');

  // Constellation figures, then their names (tap a name for the constellation).
  if (layerOn('lines')) {
    for (const f of skyData.figures) {
      for (const [a, c] of f.lines) {
        const s1 = stars.get(a), s2 = stars.get(c);
        if (s1 && s2 && (s1.alt > 0 || s2.alt > 0)) {
          const [x1, y1] = skyXY(s1.alt, s1.az), [x2, y2] = skyXY(s2.alt, s2.az);
          parts.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="figure"/>`);
        }
      }
    }
  }
  if (layerOn('names')) {
    for (const f of skyData.figures) {
      if (s < 2 && !skyData.major.has(f.abbr)) continue;
      const l = at(f.label[0], f.label[1]);
      if (l.alt <= 4) continue;
      const [x, y] = skyXY(l.alt, l.az);
      const label = f.common || f.name;
      const w = (label.length * 13) / s, h = 30 / s;
      parts.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="con-name">${esc(label)}</text>
        <rect x="${(x - w / 2).toFixed(1)}" y="${(y - h * 0.8).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" class="hit" ${pick('con', f.abbr)}/>`);
    }
  }

  // Deep-sky objects: symbols sized to their apparent size; names appear as you zoom in.
  if (layerOn('deep')) {
    const limit = s >= 4 ? 99 : s >= 2 ? 8 : 5.5;
    for (const o of skyData.dso) {
      const p = at(o.ra, o.dec);
      if (p.alt <= 0) continue;
      const [x, y] = skyXY(p.alt, p.az);
      const r = Math.max(0.008 * K * q, angularRadius(o.size[0] / 120, x, y));
      parts.push(dsoSymbol(o, x, y, r), hit(x, y, Math.max(22, r * s), 'dso', o.id));
      if ((o.mag != null && o.mag < limit) || (o.name && s >= 2) || (o.name && o.mag != null && o.mag < 4)) {
        parts.push(`<text x="${x.toFixed(1)}" y="${(y + r + 14 / s).toFixed(1)}" class="dso-name">${esc(o.name || o.cat)}</text>`);
      }
    }
  }

  // Stars, brightest last so they sit on top. Names on the bright ones (more as
  // you zoom), skipping any that would sit on a brighter star's name.
  const nameLimit = s >= 4 ? 99 : s >= 2 ? 2.6 : 1.6;
  const named = layerOn('stars')
    ? [...stars].filter(([hr, st]) => skyData.names[hr] && st.mag < nameLimit && st.alt > 3).map(([hr, st]) => [hr, skyXY(st.alt, st.az)])
    : [];
  const labelled = new Set();
  for (const [hr, [x, y]] of named) {
    if (!named.some(([o, [ox, oy]]) => labelled.has(o) && Math.hypot(ox - x, oy - y) < (0.03 * K) / s)) labelled.add(hr);
  }
  for (const [hr, st] of [...stars].reverse()) {
    if (st.alt <= 0) continue;
    const [x, y] = skyXY(st.alt, st.az);
    const r = K * q * (0.0035 + 0.0042 * Math.max(0, 4.6 - st.mag));
    const glow = Math.min(1, Math.max(0.35, (5 - st.mag) / 2.5)); // faint stars fade, as they do to the eye
    parts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${starColour(st.bv)}" fill-opacity="${glow.toFixed(2)}"/>`);
    if (skyData.names[hr] || skyData.cards[hr]) parts.push(hit(x, y, 17, 'star', hr));
    if (labelled.has(hr)) parts.push(`<text x="${(x + r + 6 / s).toFixed(1)}" y="${y.toFixed(1)}" class="star-name">${esc(skyData.names[hr])}</text>`);
  }

  // Planets and the Moon, always shown.
  for (const name of PLANETS) {
    const p = b[name];
    if (p.alt <= 0) continue;
    const [x, y] = skyXY(p.alt, p.az);
    const fill = store.settings.night ? '#ff5a3c' : PLANET_COLOUR[name];
    parts.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.017 * K * q).toFixed(1)}" fill="${fill}" class="planet"/>
      <text x="${(x + (0.017 * K * q) + 7 / s).toFixed(1)}" y="${y.toFixed(1)}" class="planet-name">${cap(name)}</text>`, hit(x, y, 24, 'planet', name));
  }
  if (b.moon.alt > 0) {
    const [x, y] = skyXY(b.moon.alt, b.moon.az);
    parts.push(moonSvg(b.moon, b.sun, Math.max(0.045 * K * q, angularRadius(0.26, x, y))), hit(x, y, 30, 'moon', 'moon'));
  }
  parts.push('</g>');
  const [vx, vy, vw, vh] = viewBoxOf(zoom);
  return `<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" style="--z:${s}" role="img" aria-label="Sky chart for ${esc(clock(t))}">
    <defs><clipPath id="dome-clip"><circle r="${K}"/></clipPath></defs>${parts.join('')}</svg>`;
}

// When the Moon or a planet crosses the horizon during tonight's window
// (worked out once per night, so dragging the slider stays smooth).
function riseSet(name) {
  skyState.events = skyState.events || {};
  if (!skyState.events[name]) {
    skyState.events[name] = Astro.crossings(d => Astro.bodies(d, SKY.lat, SKY.lon)[name].alt,
      name === 'moon' ? -0.833 : -0.5667, skyState.sunset.getTime(), skyState.sunrise.getTime(), 10)
      .map(c => ({ ...c, az: Astro.bodies(c.time, SKY.lat, SKY.lon)[name].az }));
  }
  return skyState.events[name];
}

function upTonightHtml() {
  const t = skyState.t;
  const b = Astro.bodies(t, SKY.lat, SKY.lon);
  const rows = [];
  const line = (name, text, kind, id) =>
    rows.push(`<button class="up-row" data-action="sky-pick" data-kind="${kind}" data-id="${id}"><b>${esc(name)}</b><span>${esc(text)}</span></button>`);

  const m = b.moon;
  const moonNext = riseSet('moon').find(c => c.time > t);
  line('Moon', `${cap(phaseName(m))}, ${Math.round(100 * m.illum)}% lit. ` + (m.alt > 0
    ? `${cap(height(m.alt))} in the ${compass(m.az)}${moonNext && !moonNext.rising ? `; sets ${clock(moonNext.time)}` : ''}.`
    : moonNext && moonNext.rising ? `Rises ${clock(moonNext.time)} in the ${compass(moonNext.az)}.` : 'Not up at this time.'), 'moon', 'moon');

  for (const name of PLANETS) {
    const p = b[name];
    const next = riseSet(name).find(c => c.time > t);
    if (p.alt > 0) {
      line(cap(name), `${cap(height(p.alt))} in the ${compass(p.az)}${next && !next.rising ? `; sets ${clock(next.time)}` : ''}.`, 'planet', name);
    } else if (next && next.rising) {
      line(cap(name), `Rises ${clock(next.time)} in the ${compass(next.az)}.`, 'planet', name);
    }
  }

  // The Southern Cross never sets from Auckland; Matariki and Puanga in their season.
  const at = Astro.starProjector(t, SKY.lat, SKY.lon);
  const acrux = skyData.starById.get(4730);
  const crux = at(acrux[1], acrux[2]);
  line('Southern Cross', `${cap(height(crux.alt))} in the ${compass(crux.az)}. From Auckland it never sets.`, 'con', 'Cru');
  const month = t.getMonth() + 1;
  const dawn = new Date(skyState.sunrise.getTime() - 60 * 60000);
  const pre = Astro.starProjector(dawn, SKY.lat, SKY.lon);
  const pleiades = skyData.dso.find(o => o.id === 'm45' || o.id === 'pleiades');
  if (pleiades && month >= 5 && month <= 7 && pre(pleiades.ra, pleiades.dec).alt > 2) {
    line('Matariki', 'Up in the north-east before dawn; its midwinter rising marks the Māori New Year.', 'dso', pleiades.id);
  }
  const rigel = skyData.starById.get(1713);
  if (rigel && month >= 5 && month <= 7 && pre(rigel[1], rigel[2]).alt > 2) {
    line('Puanga', 'Rigel, up before dawn; some iwi mark the new year by its rising.', 'star', 1713);
  }
  return rows.join('');
}

const lightYears = ly => (ly >= 1e6 ? `${+(ly / 1e6).toPrecision(2)} million light-years` : `${Math.round(ly).toLocaleString('en-NZ')} light-years`);
const arcSize = ([a, b]) => {
  const fmt = v => (v >= 60 ? `${+(v / 60).toPrecision(2)}°` : `${+v.toPrecision(2)}′`);
  return b && Math.abs(a - b) > 0.5 ? `${fmt(a)} × ${fmt(b)}` : fmt(a);
};

// A card's button in the info panel: its answer, unless the answer is the thing
// already tapped, then its question ("Brightest star in Lyra"). Repeats are skipped.
function panelLabel(id, term) {
  const { card } = cardIndex.get(id);
  if (card.map) return `${card.answer} on the map`;
  if (!plain(card.answer).includes(plain(term))) return card.answer;
  const q = card.label ? `${card.label} ${card.prompt}` : card.prompt;
  return q.length <= 44 && !/^\d+$/.test(card.prompt) ? q : card.answer;
}
function cardChips(ids, term, skip = []) {
  const seen = new Set(skip.map(plain));
  return ids.filter(id => cardIndex.has(id)).map(id => [id, panelLabel(id, term)])
    .filter(([, label]) => !seen.has(plain(label)) && seen.add(plain(label)))
    .map(([id, label]) => `<button class="chip" data-action="peek" data-id="${esc(id)}">${esc(label)}<small>${esc(cardIndex.get(id).deck.title)}</small></button>`).join('');
}
const conChip = abbr => {
  const f = skyData.figures.find(c => c.abbr === abbr);
  return f ? `<button class="chip" data-action="sky-pick" data-kind="con" data-id="${f.abbr}">In ${esc(f.name)}<small>Constellation</small></button>` : '';
};

// The info panel for whatever was tapped.
function pickHtml() {
  const p = skyState.pick;
  if (!p) return '<p class="sky-hint">Tap a star, constellation name, deep-sky object, planet or the Moon to find out more.</p>';
  const t = skyState.t;
  const at = Astro.starProjector(t, SKY.lat, SKY.lon);
  const where = pos => (pos.alt > 0 ? `${Math.round(pos.alt)}° up in the ${compass(pos.az)}.` : 'Below the horizon at this time.');
  let title, kind, body = '', chips = '';
  if (p.kind === 'star') {
    const s = skyData.starById.get(+p.id);
    title = skyData.names[p.id] || `HR ${p.id}`;
    kind = `Star, magnitude ${s[3].toFixed(1)}`;
    body = where(at(s[1], s[2]));
    if (skyData.maori[p.id]) body += ` Māori name: ${skyData.maori[p.id]}.`;
    if (s[2] < -(90 - Math.abs(SKY.lat))) body += ' From Auckland it never sets.';
    chips = cardChips(skyData.cards[p.id] ? [skyData.cards[p.id]] : [], title) + conChip(skyData.starCon.get(+p.id));
  } else if (p.kind === 'dso') {
    const o = skyData.dso.find(x => x.id === p.id);
    title = o.name || o.cat;
    kind = [o.name ? o.cat : null, o.alt, cap(o.type)].filter(Boolean).join(' · ');
    const facts = [o.mag != null ? `magnitude ${o.mag}` : null, o.size ? `${arcSize(o.size)} across` : null, o.dist ? lightYears(o.dist) + ' away' : null].filter(Boolean);
    body = `${where(at(o.ra, o.dec))}${facts.length ? ` ${cap(facts.join(', '))}.` : ''}${o.note ? ` ${o.note}` : ''}`;
    chips = cardChips(o.card ? [o.card] : [], title) + (o.con ? conChip(o.con) : '');
  } else if (p.kind === 'con') {
    const f = skyData.figures.find(c => c.abbr === p.id);
    title = f.common ? `${f.name}, the ${f.common}` : f.name;
    kind = f.meaning ? `Constellation: ${f.meaning}` : 'Constellation';
    body = `${where(at(f.label[0], f.label[1]))}${f.story ? ` ${f.story}` : ''}`;
    const bright = f.brightest && skyData.starById.get(f.brightest);
    const brightName = bright ? skyData.names[f.brightest] || 'Brightest star' : null;
    chips = (bright ? `<button class="chip" data-action="sky-pick" data-kind="star" data-id="${f.brightest}">${esc(brightName)}<small>Brightest star</small></button>` : '')
      + cardChips(f.cards || [], f.name, brightName ? [brightName] : []);
  } else {
    const b = Astro.bodies(t, SKY.lat, SKY.lon);
    const bodyAt = b[p.id];
    title = p.id === 'moon' ? 'The Moon' : cap(p.id);
    kind = p.id === 'moon' ? `${cap(phaseName(bodyAt))}, ${Math.round(100 * bodyAt.illum)}% lit` : 'Planet';
    body = where(bodyAt);
    if (p.id !== 'moon') body += ` ${bodyAt.dist.toFixed(2)} au from Earth tonight, light taking ${Math.round(bodyAt.dist * 8.317)} minutes to reach you.`;
    // The planet's namesake in the myths deck, or the Moon's card.
    const want = p.id === 'moon' ? 'The Moon' : cap(p.id);
    for (const [id, { card, deck }] of cardIndex) {
      if (!id.endsWith(REV) && card.answer === want && (deck.id === 'greek-myths' || deck.id === 'sky-and-space')) { chips = cardChips([id], title); break; }
    }
  }
  return `<div class="sky-pick">
    <button class="sky-unpick" data-action="sky-unpick" aria-label="Close">×</button>
    <h3>${esc(title)}</h3>
    <p class="kind">${esc(kind)}</p>
    <p>${esc(body)}</p>
    ${chips ? `<div class="chips left">${chips}</div>` : ''}
  </div>`;
}

function layersHtml() {
  return `<div class="sky-layers">${LAYERS.map(([key, name]) =>
    `<button data-action="sky-layer" data-layer="${key}" aria-pressed="${layerOn(key)}">${name}</button>`).join('')}</div>`;
}

function facingHtml(short) {
  return `<div class="seg facing">${[[0, 'North'], [90, 'East'], [180, 'South'], [270, 'West']].map(([az, n]) =>
    `<button data-action="sky-face" data-az="${az}" aria-pressed="${skyState.facing === az}">${short ? n[0] : n}</button>`).join('')}</div>`;
}

function timeHtml() {
  const { sunset, sunrise, t } = skyState;
  const steps = Math.round((sunrise - sunset) / STEP);
  return `<div class="sky-time">
      <span id="sky-clock">${clock(t)}</span>
      <input id="sky-slider" type="range" min="0" max="${steps}" value="${Math.round((t - sunset) / STEP)}" aria-label="Time tonight">
    </div>`;
}

function renderSky() {
  const { sunset, sunrise } = skyState;
  const red = `<button class="sky-red" data-action="sky-night" aria-pressed="${!!store.settings.night}">Red light</button>`;
  if (skyState.full) {

      <div class="sky-full-top">
        <button class="close" data-action="sky-full" aria-label="Leave full screen">×</button>
        ${facingHtml(true)}
        ${red}
      </div>
      <div id="sky-dome" class="sky-dome full">${skySvg()}</div>
      <div id="sky-pick" class="sky-sheet">${skyState.pick ? pickHtml() : ''}</div>
      <div class="sky-full-bottom">${timeHtml()}${layersHtml()}</div>
    </div>`;
  }
  const night = sunset.toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<button class="back" data-action="home">‹ Almanac</button>
    <h2 class="pagetitle">Tonight’s sky</h2>
    <p class="lede">${SKY.place}, ${esc(night)}. Sunset ${clock(sunset)}, sunrise ${clock(sunrise)}.</p>
    ${facingHtml(false)}
    ${layersHtml()}
    <div id="sky-dome" class="sky-dome">${skySvg()}</div>
    <div class="sky-tools">
      <button class="btn quiet" data-action="sky-full">Full screen, with zoom</button>
      ${red}
    </div>
    ${timeHtml()}
    <div id="sky-pick">${pickHtml()}</div>
    <p class="label group">Up tonight</p>
    <div id="sky-up">${upTonightHtml()}</div>`;
